<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="only light"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Philip's Finance Hub v15.9</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finance Hub">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000000; color: #fff; font-family: 'Outfit', sans-serif; min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 90px; }
  .app-header { text-align: center; padding: 20px 16px 0; position: relative; }
  .app-header .sub { font-size: 10px; letter-spacing: 4px; color: #C9C9C9; text-transform: uppercase; margin-bottom: 2px; }
  .app-header h1 { font-size: 24px; font-weight: 900; background: linear-gradient(135deg, #FFFFFF, #B0B0B0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; background: #0D0D0D; border-top: 1px solid #333333; z-index: 100; }
  .nav-btn { position: relative; flex: 1; padding: 13px 4px 11px; background: none; border: none; color: #C9C9C9; font-size: 9px; font-weight: 700; cursor: pointer; font-family: 'Outfit', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color .18s ease; }
  .nav-btn .nav-icon { font-size: 18px; transition: transform .18s ease; }
  /* the solid bar that tells you where you are */
  .nav-btn::before { content:''; position:absolute; top:0; left:18%; right:18%; height:3px;
    background: var(--tab); border-radius: 0 0 3px 3px; transform: scaleX(0); transform-origin: center;
    transition: transform .2s cubic-bezier(.3,.8,.3,1); }
  .nav-btn.active::before { transform: scaleX(1); }
  .nav-btn.active { color: var(--tab); }
  .nav-btn.active .nav-icon { transform: translateY(-1px) scale(1.12); }
    #nav-debt    { --tab:#FF453A; }
  #nav-savings { --tab:#32ADE6; }
  #nav-money   { --tab:#FFD60A; }
  #nav-budget  { --tab:#FF9F0A; }
  #nav-wn      { --tab:#BF5AF2; }
  #nav-backup  { --tab:#8E8E93; }
  .page { display: none; padding: 14px 16px; }
  .page.active { display: block; animation: pageIn .26s cubic-bezier(.22,.8,.3,1) both; }

  @keyframes pageIn   { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform:none } }
  @keyframes cardIn   { from { opacity:0; transform: translateY(9px) } to { opacity:1; transform:none } }
  @keyframes popIn    { 0% { transform: scale(.95); opacity:0 } 60% { transform: scale(1.015) } 100% { transform: scale(1); opacity:1 } }
  @keyframes sheen    { 0% { transform: translateX(-120%) } 100% { transform: translateX(320%) } }
  @keyframes softPulse{ 0%,100% { box-shadow: 0 0 0 0 rgba(255,159,10,.32) } 50% { box-shadow: 0 0 0 6px rgba(255,159,10,0) } }

  .goal-card, .savings-goal-card, .wn-item { animation: cardIn .3s cubic-bezier(.22,.8,.3,1) both; }
  .goal-card:nth-child(2), .savings-goal-card:nth-child(2) { animation-delay:.035s }
  .goal-card:nth-child(3), .savings-goal-card:nth-child(3) { animation-delay:.07s }
  .goal-card:nth-child(4), .savings-goal-card:nth-child(4) { animation-delay:.105s }
  .goal-card:nth-child(5), .savings-goal-card:nth-child(5) { animation-delay:.14s }
  .goal-card:nth-child(n+6), .savings-goal-card:nth-child(n+6) { animation-delay:.17s }

  button { transition: transform .12s cubic-bezier(.3,.8,.3,1), filter .16s ease; }
  button:active { transform: scale(.955); filter: brightness(1.12); }
  .goal-card, .savings-goal-card { transition: border-color .2s ease, background .2s ease, transform .16s ease; }
  .goal-card:active, .savings-goal-card:active { transform: scale(.992); }
  .modal { animation: popIn .24s cubic-bezier(.22,.8,.3,1) both; }
  .toast { animation: popIn .26s cubic-bezier(.22,.8,.3,1) both; }

  /* a filling bar with a light passing over it */
  .bar-wrap { overflow: hidden; }
  .bar-fill { position: relative; overflow: hidden; }
  .bar-fill::after { content:''; position:absolute; top:0; bottom:0; width:38%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
    animation: sheen 2.6s ease-in-out infinite; }
  .settle-pulse { animation: softPulse 2.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
  .card { background: #161616; border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; border: 1px solid #333333; }
  .bar-wrap { background: #000000; border-radius: 99px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .label-sm { font-size: 12px; color: #fff; font-weight: 600; }
  .val-green { font-size: 13px; font-weight: 700; color: #30D158; }
  .val-muted { font-size: 13px; color: #fff; font-weight: 600; }
  .val-gold { color: #E5E5E5; font-weight: 700; font-size: 12px; }
  .section-title { font-size: 13px; font-weight: 800; color: #ccc; margin-bottom: 10px; }
  .btn-primary { width: 100%; padding: 15px; border-radius: 14px; background: linear-gradient(135deg, #30D158, #28A745); border: none; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; font-family: 'Outfit', sans-serif; box-shadow: 0 4px 20px rgba(52,199,89,0.25); margin-bottom: 12px; }
  .btn-sm { padding: 6px 14px; border-radius: 8px; border: none; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Outfit', sans-serif; }
  .btn-ghost { padding: 6px 12px; border-radius: 8px; background: #1E1E1E; border: 1px solid #2A2A3E; color: #C9C9C9; font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Outfit', sans-serif; }
  .btn-cancel { padding: 6px 10px; border-radius: 8px; background: #222; border: none; color: #C9C9C9; font-size: 12px; cursor: pointer; font-family: 'Outfit', sans-serif; }
  .btn-danger { padding: 11px 16px; border-radius: 10px; background: #161616; border: 1px solid #3A1A1A; color: #FF453A; font-size: 12px; cursor: pointer; font-family: 'Outfit', sans-serif; }
  .btn-footer { flex: 1; padding: 11px; border-radius: 10px; background: #161616; border: 1px solid #333333; color: #C9C9C9; font-size: 12px; cursor: pointer; font-family: 'Outfit', sans-serif; }
  .footer-row { display: flex; gap: 8px; margin-top: 16px; }

  /* GOAL CARDS */
  .savings-goal-card, .goal-card, .card { max-width: 100%; box-sizing: border-box; overflow: hidden; }
  .savings-content { min-width: 0; }
  .goal-card { border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid #333333; background: #161616; position: relative; transition: border 0.2s, background 0.2s; display: flex; align-items: stretch; }
  .goal-card.active-goal { background: #161616; }
  .goal-card.focus-card { border-width: 2px; background: #12100A; }
  .focus-tag { display:inline-block; font-size:9px; font-weight:900; letter-spacing:0.5px; padding:2px 7px; border-radius:6px; margin-bottom:6px; }
  .goal-card.done { background: #0D1F0D; border-color: #1E3A2A; opacity: 0.75; }
  .goal-card.drag-over { border: 2px solid #E5E5E5; background: #1E1E1E; }
  .goal-card.is-dragging { opacity: 0.35; border: 2px dashed #E5E5E5; }
  .drag-handle { display: flex; align-items: center; justify-content: center; width: 32px; min-width: 32px; cursor: grab; color: #333; font-size: 20px; user-select: none; touch-action: none; border-radius: 8px; transition: color 0.2s; margin: -14px 8px -14px -16px; padding: 14px 8px; }
  .drag-handle:active { cursor: grabbing; color: #E5E5E5; }
  .goal-content { flex: 1; min-width: 0; }
  .goal-actions { display: flex; flex-direction: column; gap: 4px; justify-content: center; margin: -14px -16px -14px 8px; padding: 8px 10px; }
  .btn-edit-goal { background: #1E1E1E; border: 1px solid #2A2A4E; border-radius: 8px; color: #32ADE6; font-size: 13px; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-delete-goal { background: #2A1A1A; border: 1px solid #4E2A2A; border-radius: 8px; color: #FF453A; font-size: 13px; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .goal-name { font-size: 14px; font-weight: 700; }
  .goal-person { font-size: 11px; color: #A0A0A0; margin-top: 2px; }
  .active-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
  .custom-wrap { display: flex; gap: 6px; align-items: center; }
  .custom-input { width: 85px; padding: 5px 8px; border-radius: 8px; background: #000000; border: 1px solid #2A2A2A; color: #fff; font-size: 13px; font-family: 'Outfit', sans-serif; }
  .custom-input:focus { outline: none; border-color: #C9C9C9; }
  .reorder-hint { text-align: center; font-size: 11px; color: #C9C9C9; margin-bottom: 10px; padding: 8px 12px; background: #161616; border-radius: 10px; border: 1px solid #333333; }
  .log-section { background: #161616; border-radius: 12px; padding: 14px; margin-top: 10px; display: none; }
  .log-section.visible { display: block; }
  .log-title { font-size: 12px; color: #C9C9C9; margin-bottom: 8px; }
  .log-entry { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #333333; font-size: 12px; }
  .log-entry:last-child { border-bottom: none; }

  /* DEADLINE BADGE */
  .deadline-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; margin-top: 4px; }
  .dl-green  { background: #0D2A0D; color: #30D158; border: 1px solid #1E3A2A; }
  .dl-yellow { background: #2A1A0D; color: #FF9F0A; border: 1px solid #3A2A1A; }
  .dl-red    { background: #2A0D0D; color: #FF453A; border: 1px solid #3A1A1A; }

  /* MANAGE DEBT MODAL */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 500; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #161616; border-radius: 20px 20px 0 0; padding: 20px 20px 40px; width: 100%; max-width: 480px; border-top: 1px solid #2A2A2A; max-height: 85vh; overflow-y: auto; }
  .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: #fff; }
  .modal-input { width: 100%; padding: 11px 14px; border-radius: 12px; background: #101010; border: 1px solid #2A2A2A; color: #fff; font-size: 14px; font-family: 'Outfit', sans-serif; margin-bottom: 10px; }
  .modal-input:focus { outline: none; border-color: #FFD700; }
  .modal-label { font-size: 11px; color: #C9C9C9; margin-bottom: 5px; display: block; }
  .sheet-wrap { display:none; position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:400; align-items:flex-end; justify-content:center; }
  .sheet-wrap.open { display:flex; }
  .sheet-panel { width:100%; max-width:480px; max-height:86vh; overflow-y:auto; background:#141414; border-radius:22px 22px 0 0;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom)); border-top:1px solid #333333; }
  .plan-preview { margin:-2px 0 12px; font-size:12px; font-weight:700; color:#30D158; line-height:1.45; min-height:17px; }
  .color-picker-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s; }
  .color-dot.selected { border-color: #fff; transform: scale(1.2); }
  .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
  .btn-modal-save { flex: 1; padding: 13px; border-radius: 12px; background: linear-gradient(135deg,#30D158,#28A745); border: none; color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; font-family: 'Outfit', sans-serif; }
  .btn-modal-cancel { padding: 13px 16px; border-radius: 12px; background: #222; border: 1px solid #333; color: #C9C9C9; font-size: 14px; cursor: pointer; font-family: 'Outfit', sans-serif; }
  .add-debt-btn { width: 100%; padding: 13px; border-radius: 14px; background: #161616; border: 1px dashed #E5E5E566; color: #E5E5E5; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Outfit', sans-serif; margin-bottom: 12px; }

  /* OTHER TABS */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .summary-box { background: #161616; border-radius: 14px; padding: 12px 8px; border: 1px solid #333333; text-align: center; }
  .summary-box .box-label { font-size: 9px; color: #C9C9C9; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
  .summary-box .box-val { font-size: 15px; font-weight: 800; }
  .box-income{color:#30D158;}.box-expense{color:#FF6B35;}.box-balance{color:#FFD700;}
  .add-entry-form { background: #161616; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #333333; }
  .form-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
  .form-input { width: 100%; padding: 10px 12px; border-radius: 10px; background: #101010; border: 1px solid #2A2A2A; color: #fff; font-size: 13px; font-family: 'Outfit', sans-serif; margin-bottom: 8px; }
  .form-input:focus { outline: none; border-color: #C9C9C9; }
  .btn-add-entry { width: 100%; padding: 12px; border-radius: 12px; border: none; color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; font-family: 'Outfit', sans-serif; }
  .entry-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333333; }
  .entry-item:last-child { border-bottom: none; }
  .entry-desc { font-size: 13px; font-weight: 600; color: #ddd; }
  .entry-meta { font-size: 11px; color: #C9C9C9; margin-top: 1px; }
  .entry-right { display: flex; align-items: center; gap: 8px; }
  .entry-amt { font-size: 14px; font-weight: 800; }
  .btn-del { background: none; border: none; color: #333; font-size: 14px; cursor: pointer; padding: 2px 4px; }

  /* SPENDING TRACKER */
  .period-select-wrap { margin: 10px 0 14px; position: relative; }
  .period-select {
    width: 100%; padding: 12px 42px 12px 14px; border-radius: 12px;
    background: #161616; border: 1px solid var(--period-accent, #333333);
    color: #E5E5E5; font-size: 13px; font-weight: 800; cursor: pointer;
    font-family: 'Outfit', sans-serif; color-scheme: dark;
    appearance: auto;
  }
  .period-select:focus { outline: none; border-color: var(--period-accent, #E5E5E5); }
  .spend-big { text-align: center; padding: 20px; background: #161616; border-radius: 16px; margin-bottom: 12px; border: 1px solid #333333; }
  .spend-big-label { font-size: 11px; color: #C9C9C9; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
  .spend-big-amt { font-size: 36px; font-weight: 900; color: #fff; }
  .spend-big-sub { font-size: 12px; color: #C9C9C9; margin-top: 4px; }
  /* SAVINGS SUMMARY ON MONEY TAB */
  .sav-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .sav-sum-box { background: #161616; border-radius: 14px; padding: 12px 10px; border: 1px solid #32ADE622; text-align: center; }
  .sav-sum-box .ssl { font-size: 9px; color: #32ADE6; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .sav-sum-box .ssv { font-size: 18px; font-weight: 900; color: #32ADE6; }
  /* BIG CATEGORY BOXES */
  .cat-big-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .cat-big-box { background: #161616; border-radius: 16px; padding: 16px 14px; border: 1px solid #333333; position: relative; }
  .cat-big-box .cbb-icon { font-size: 24px; margin-bottom: 6px; }
  .cat-big-box .cbb-label { font-size: 10px; color: #C9C9C9; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .cat-big-box .cbb-amt { font-size: 22px; font-weight: 900; }
  .cat-big-box .cbb-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #2A2A2A; font-size: 14px; cursor: pointer; padding: 2px; }
  .cat-big-box .cbb-del:hover { color: #FF453A; }
  .cat-big-box.add-cat-box { border: 1px dashed #2A2A2A; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; min-height: 100px; }
  .cat-big-box.add-cat-box:hover { border-color: #FFD700; }
  /* ADD CATEGORY MODAL */
  .cat-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 600; display: none; align-items: flex-end; justify-content: center; }
  .cat-modal.open { display: flex; }
  .cat-modal-box { background: #161616; border-radius: 20px 20px 0 0; padding: 20px 20px 40px; width: 100%; max-width: 480px; border-top: 1px solid #2A2A2A; }
  .cat-modal-title { font-size: 15px; font-weight: 800; margin-bottom: 14px; }
  .cat-modal-input { width: 100%; padding: 11px 14px; border-radius: 12px; background: #101010; border: 1px solid #2A2A2A; color: #fff; font-size: 14px; font-family: 'Outfit', sans-serif; margin-bottom: 10px; }
  .cat-modal-input:focus { outline: none; border-color: #E5E5E5; }
  .emoji-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .emoji-opt { font-size: 22px; cursor: pointer; padding: 4px; border-radius: 8px; border: 2px solid transparent; }
  .emoji-opt.sel { border-color: #E5E5E5; background: #1E1E1E; }
  .cat-color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .cat-color-dot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .cat-color-dot.sel { border-color: #fff; transform: scale(1.2); }
  /* LOG FORM */
  .spend-log-form { background: #161616; border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; border: 1px solid #333333; }
  .spend-log-input { width: 100%; padding: 10px 12px; border-radius: 10px; background: #101010; border: 1px solid #2A2A2A; color: #fff; font-size: 13px; font-family: 'Outfit', sans-serif; margin-bottom: 8px; box-sizing: border-box; }
  .spend-log-input:focus { outline: none; border-color: #E5E5E5; }
  .spend-cat-select { width: 100%; padding: 10px 12px; border-radius: 10px; background: #101010; border: 1px solid #2A2A2A; color: #fff; font-size: 13px; font-family: 'Outfit', sans-serif; margin-bottom: 8px; box-sizing: border-box; appearance: none; }
  .spend-cat-select:focus { outline: none; border-color: #E5E5E5; }
  /* HISTORY */
  .history-card { background: #161616; border-radius: 14px; padding: 4px 14px; border: 1px solid #333333; margin-bottom: 10px; }
  .spend-history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .empty-msg { text-align: center; color: #C9C9C9; font-size: 13px; padding: 20px 0; }

  /* SAVINGS TAB — like Debt */
  .savings-goal-card { border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: #161616; border: 1px solid #333333; position: relative; display: flex; align-items: stretch; }
  .savings-goal-card.done { background: #0D1F0D; border-color: #1E3A2A; opacity: 0.75; }
  .savings-goal-card.drag-over { border: 2px solid #32ADE6; background: #0A1220; }
  .savings-goal-card.is-dragging { opacity: 0.35; border: 2px dashed #32ADE6; }
  .savings-content { flex: 1; min-width: 0; }
  .add-savings-btn { width: 100%; padding: 13px; border-radius: 14px; background: #161616; border: 1px dashed #32ADE666; color: #32ADE6; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Outfit', sans-serif; margin-bottom: 12px; }

  /* SAVINGS STREAK */
  .sav-streak-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .sav-streak-box { border-radius: 14px; padding: 12px 8px; border: 1px solid #333333; text-align: center; background: #161616; }
  .sav-streak-box .ssb-icon { font-size: 22px; margin-bottom: 4px; }
  .sav-streak-box .ssb-val { font-size: 20px; font-weight: 900; }
  .sav-streak-box .ssb-label { font-size: 10px; color: #C9C9C9; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

  /* SAVINGS MODAL */
  .sav-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 500; display: none; align-items: flex-end; justify-content: center; }
  .sav-modal.open { display: flex; }
  .sav-modal-box { background: #161616; border-radius: 20px 20px 0 0; padding: 20px 20px 40px; width: 100%; max-width: 480px; border-top: 1px solid #2A2A2A; max-height: 80vh; overflow-y: auto; }

  /* WANTS & NEEDS */
  .wn-tabs { display: flex; gap: 8px; margin-bottom: 14px; }

  .wn-tab.active-need { background: #0A1A2E; border-color: #32ADE6; color: #32ADE6; }
  .wn-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .wn-box { background: #161616; border-radius: 14px; padding: 12px; border: 1px solid #333333; text-align: center; }

  .wn-box .wn-val { font-size: 17px; font-weight: 800; }

<!-- ADD / EDIT DEBT MODAL -->
<div class="modal-overlay" id="debtModal">

    <div class="modal-title" id="modalTitle">Add New Debt</div>
    <label class="modal-label">Debt Name *</label>
    <input class="modal-input" id="modalName" placeholder="e.g. John Phone Debt"/>
    <label class="modal-label">Person (optional)</label>
    <input class="modal-input" id="modalPerson" placeholder="e.g. John"/>
    <label class="modal-label">Total Amount (GH₵) *</label>
    <input class="modal-input" type="number" id="modalAmount" placeholder="e.g. 500" oninput="updateDebtPreview()"/>
    <label class="modal-label">Amount Already Paid (GH₵)</label>
    <input class="modal-input" type="number" id="modalPaid" placeholder="0" oninput="updateDebtPreview()"/>
    <label class="modal-label">Target Date (when to finish)</label>
    <input class="modal-input" type="date" id="modalDate" onchange="updateDebtPreview()" oninput="updateDebtPreview()"/>
    <label class="modal-label">Pay every</label>
    <select class="modal-input" id="modalFreq" onchange="updateDebtPreview()"><option value="day">Day</option><option value="week">Week</option></select>
    <div id="modalQuickDates"></div>
    <div class="plan-preview" id="modalPlanPreview"></div>
    <label class="modal-label">Color</label>
    <div class="color-picker-row" id="colorPicker"></div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-modal-save" onclick="saveDebtModal()">Save Debt</button>
    </div>
  </div>
</div>

// Savings streak/balance (like debt)
function getSavStreakData(){
  // Only ACTIVE goals run the clock. No active goal -> everything is zero and the clock resets.
  const activeGoals = savGoals.filter(g=>!g.completed);
  if(activeGoals.length===0){
    if(state.savings){
      let ch=false;
      if((state.savings.baseCredits||0)!==0){state.savings.baseCredits=0;ch=true;}
      if((state.savings.baseTotal||0)!==0){state.savings.baseTotal=0;ch=true;}
      if(state.savings.anchor){state.savings.anchor=null;ch=true;}
      if(ch) saveAll();
    }
    return {totalCredits:0, daysBehind:0, daysAhead:0, streak:0, catchUp:0};
  }
  if(!state.savings) state.savings={goals:[]};
  // The clock STARTS the moment a saving becomes active (new goal or reopen).
  if(!state.savings.anchor){ state.savings.anchor=TODAY; saveAll(); }
  const anchor=state.savings.anchor;
  // Only deposits made on/after the anchor count toward this run.
  const runLogs=activeGoals.flatMap(g=>(g.log||[]).filter(l=>(l.date||"")>=anchor));
  const logDates=[...new Set(runLogs.map(l=>l.date))].sort();
  // Ahead/Behind = the exact sum of every goal's own +/- days, same as the cards
  let totAhead=0, totBehind=0, catchUpMoney=0, sumDaily=0, sumSaved=0;
  for(const g of activeGoals){
    if(g.saved>=g.target) continue;
    const d=(g.dailyTarget>0?g.dailyTarget:DAILY_SAV);
    sumDaily+=d; sumSaved+=(g.saved||0);
    const _pd=paceDaysOf(g, g.saved, g.target, d);
    if(_pd.days>0) totAhead+=_pd.days;
    else if(_pd.days<0){ totBehind+=-_pd.days; catchUpMoney+=_pd.short; }
  }
  const balance=totAhead-totBehind;
  const daysBehind=balance<0?-balance:0;
  const daysAhead=balance>0?balance:0;
  const totalCredits=sumDaily>0?Math.floor(sumSaved/sumDaily):0;
  const catchUp=Math.round(catchUpMoney);
  let streak=0, checkDate=new Date(TODAY);
  while(true){
    const ds=checkDate.toISOString().split("T")[0];
    if(logDates.includes(ds)){ streak++; checkDate.setDate(checkDate.getDate()-1); } else break;
  }
  return {totalCredits, daysBehind, daysAhead, streak, catchUp};
}

// ===== DEADLINE HELPERS =====
function deadlineDaysLeft(dl){
  if(!dl) return null;
  const now = new Date(TODAY);
  const d   = new Date(dl);
  return Math.ceil((d - now)/(1000*60*60*24));
}
function deadlineBadgeHTML(dl){
  const days = deadlineDaysLeft(dl);
  if(days===null) return "";
  if(days < 0) return `<span class="deadline-badge dl-red">🔴 ${Math.abs(days)}d overdue</span>`;
  if(days === 0) return `<span class="deadline-badge dl-red">🔴 Due TODAY!</span>`;
  if(days <= 7)  return `<span class="deadline-badge dl-red">🔴 ${days}d left</span>`;
  if(days <= 21) return `<span class="deadline-badge dl-yellow">🟡 ${days}d left</span>`;
  return `<span class="deadline-badge dl-green">🟢 ${days}d left</span>`;
}
function dueSoon(dl){ const d=deadlineDaysLeft(dl); return d!==null && d<=10; }
function urgencyKey(dl){ const d=deadlineDaysLeft(dl); return d===null?Infinity:d; }
function sortByDueSoon(items, getDl){
  return [...items].sort((a,b)=>{
    const sa=dueSoon(getDl(a))?0:1, sb=dueSoon(getDl(b))?0:1;
    if(sa!==sb) return sa-sb;
    if(sa===0) return urgencyKey(getDl(a))-urgencyKey(getDl(b));
    return 0;
  });
}
function sortPinnedDueSoon(items, getDl){
  if(items.length<=1) return items;
  return [items[0], ...sortByDueSoon(items.slice(1), getDl)];
}
function sortDebtsDisplay(items){ return sortPinnedDueSoon(items, g=>(((D().paid[g.id]||0)>=g.amount)?null:g.deadline)); }
function sortSavDisplay(items){ return sortPinnedDueSoon(items, g=>((g.completed||g.saved>=g.target)?null:g.deadline)); }
function renewSub(id){
  const s=subs.find(x=>String(x.id)===String(id)); if(!s) return;
  let d = s.deadline ? new Date(s.deadline) : new Date(TODAY);
  const today=new Date(TODAY);
  do{ d.setMonth(d.getMonth()+1); }while(d < today);
  s.deadline=d.toISOString().split("T")[0]; s.cancelled=false;
  saveSubs(); bumpSubToTop(id); renderBudget(); showToast("🔁 Renewed · next "+s.deadline);
}
function cancelSub(id){
  const s=subs.find(x=>String(x.id)===String(id)); if(!s) return;
  s.cancelled=true; saveSubs(); renderBudget(); showToast("Subscription cancelled");

function reactivateSub(id){

  s.cancelled=false;
  if(s.deadline){ let d=new Date(s.deadline); const t=new Date(TODAY); while(d<t){ d.setMonth(d.getMonth()+1);} s.deadline=d.toISOString().split("T")[0]; }

// ===== STREAK =====
function daysBetween(a,b){ return Math.floor((new Date(b)-new Date(a))/(1000*60*60*24)); }
function getStreakData(){
  const totalPaid=Object.values(D().paid).reduce((a,b)=>a+b,0);
  const _bc=(D().baseCredits||0), _bt=(D().baseTotal||0);
  const totalCredits=Math.floor(_bc + (totalPaid - _bt)/DAILY_DEBT);
  const daysElapsed=daysBetween(START_DATE,TODAY);
  const balance=totalCredits-daysElapsed;
  const daysBehind=balance<0?Math.abs(balance):0;
  const daysAhead=balance>0?balance:0;
  const logDates=[...new Set(D().log.map(l=>l.date))].sort();
  let streak=0, checkDate=new Date(TODAY);
  while(true){
    const ds=checkDate.toISOString().split("T")[0];
    if(logDates.includes(ds)){streak++;checkDate.setDate(checkDate.getDate()-1);}else break;
  }
  return {totalCredits,daysBehind,daysAhead,streak};
}

function getActiveIdx(){
  const goals=getOrderedGoals();
  for(let i=0;i<goals.length;i++){if((D().paid[goals[i].id]||0)<goals[i].amount) return i;}
  return -1;
}
function logAmount(amount){
  const amt=parseFloat(amount);
  if(!amt||amt<=0){showToast("Enter a valid amount","#FF453A");return;}
  const credits=Math.floor(amt/DAILY_DEBT);
  let remaining=amt, idx=getActiveIdx();
  const goals=getOrderedGoals();
  const bumpId = (idx!==-1 && goals[idx]) ? goals[idx].id : null;
  while(remaining>0&&idx!==-1){
    const g=goals[idx];
    const owed=g.amount-(D().paid[g.id]||0);
    const pay=Math.min(remaining,owed);
    D().paid[g.id]=(D().paid[g.id]||0)+pay;
    D().log.push({date:TODAY,goalId:g.id,amount:pay,label:g.label});
    remaining-=pay; idx=getActiveIdx();
  }
  if(bumpId){ goalOrder=[bumpId,...goalOrder.filter(x=>x!==bumpId)]; saveOrder(); }
  saveAll();
  showToast(credits>1?`✅ GH₵${amt} = ${credits} days credited!`:`✅ GH₵${amt} logged!`);
  renderDebt();
}

let touchDragId=null, touchOverId=null, ghost=null;
let touchDragType="debt"; // "debt" or "sav"
function handleTouchStart(e, id, type){
  touchDragType=type||"debt";
  touchDragId=id; touchOverId=null;
  ghost=document.getElementById("dragGhost");
  const g = touchDragType==="sav" ? savGoals.find(x=>String(x.id)===String(id)) : debtGoals.find(x=>String(x.id)===String(id));

  if(card) card.classList.add("is-dragging");

function movGhost(touch){
  if(!ghost) return;
  ghost.style.left=(touch.clientX+10)+"px"; ghost.style.top=(touch.clientY-20)+"px";
}
function handleTouchMove(e){
  if(!touchDragId) return;
  const touch=e.touches[0]; movGhost(touch);
  const cardClass = touchDragType==="sav" ? "savings-goal-card" : "goal-card";
  const els=document.elementsFromPoint(touch.clientX,touch.clientY);
  const overCard=els.find(el=>el.classList&&el.classList.contains(cardClass)&&el.dataset.id&&el.dataset.id!==touchDragId);
  document.querySelectorAll(".goal-card,.savings-goal-card").forEach(c=>c.classList.remove("drag-over"));
  if(overCard){overCard.classList.add("drag-over");touchOverId=overCard.dataset.id;}else touchOverId=null;
}
function handleTouchEnd(){
  if(!touchDragId) return;
  if(ghost){ghost.style.display="none";ghost=null;}
  document.querySelectorAll(".goal-card,.savings-goal-card").forEach(c=>{c.classList.remove("is-dragging");c.classList.remove("drag-over");});
  if(touchDragId&&touchOverId&&touchDragId!==touchOverId){
    if(touchDragType==="sav"){
      const from=savOrder.indexOf(touchDragId),to=savOrder.indexOf(touchOverId);
      savOrder.splice(from,1);savOrder.splice(to,0,touchDragId);
      saveSavOrder(); showToast("✅ Order saved!"); renderSavings();
    } else {
      const from=goalOrder.indexOf(touchDragId),to=goalOrder.indexOf(touchOverId);
      goalOrder.splice(from,1);goalOrder.splice(to,0,touchDragId);
      saveOrder(); showToast("✅ Order saved!"); renderDebt();
    }
  }
  touchDragId=null; touchOverId=null;
}
function attachHandleEvents(){
  document.querySelectorAll(".drag-handle[data-type='debt']").forEach(handle=>{
    const id=handle.dataset.id;
    handle.addEventListener("touchstart",e=>handleTouchStart(e,id,"debt"),{passive:true});
  });
  document.querySelectorAll(".drag-handle[data-type='sav']").forEach(handle=>{
    const id=handle.dataset.id;
    handle.addEventListener("touchstart",e=>handleTouchStart(e,id,"sav"),{passive:true});
  });
  document.addEventListener("touchmove",e=>{if(touchDragId) handleTouchMove(e);},{passive:true});
  document.addEventListener("touchend",handleTouchEnd,{passive:true});
}

// ===================== PLAN ENGINE (Debt + Buy) =====================
const BUY_KEY="pfhub_buy_plans_v1";
function loadBuy(){ try{const r=localStorage.getItem(BUY_KEY); if(r) return JSON.parse(r);}catch(e){} return []; }
let buyPlans=loadBuy();
function saveBuy(){ localStorage.setItem(BUY_KEY, JSON.stringify(buyPlans)); }
function uid(pre){ return pre+Date.now().toString(36)+Math.floor(Math.random()*100000).toString(36); }
function addDaysISO(ds,n){ const d=new Date(ds); d.setDate(d.getDate()+n); return d.toISOString().split("T")[0]; }

// unified accessors
function pPaid(side,p){ return side==='buy' ? (p.saved||0) : (D().paid[p.id]||0); }
function pLogs(side,p){ return side==='buy' ? (p.log||[]) : D().log.filter(l=>l.goalId===p.id); }
function pList(side){ return side==='buy' ? buyPlans : getOrderedGoals(); }
function pDaily(side,p){
  if(p.planDaily>0) return p.planDaily;
  const rem=Math.max(p.amount-pPaid(side,p),0);
  if(p.deadline){ const d=deadlineDaysLeft(p.deadline); if(d&&d>0) return Math.max(1,Math.ceil(rem/d)); }
  return side==='buy' ? 200 : DAILY_DEBT;
}
function pAnchor(side,p){
  if(p.planStart) return p.planStart;
  const logs=pLogs(side,p);
  if(logs.length) return logs.map(l=>l.date).sort()[0];
  return TODAY;
}
function pPace(side,p){
  const paid=pPaid(side,p), amt=p.amount, rem=Math.max(amt-paid,0);
  const daily=pDaily(side,p), done=paid>=amt;
  const daysLeft=done?0:Math.ceil(rem/daily);
  const finish=done?"":addDaysISO(TODAY,daysLeft);
  const anchor=pAnchor(side,p);
  const elapsed=Math.max(daysBetween(anchor,TODAY),0);
  const expected=Math.min(elapsed*daily,amt);
  const net=paid-expected;
  const daysAhead=net>0?Math.floor(net/daily):0;
  const daysBehind=net<0?Math.ceil(-net/daily):0;
  return {paid,amt,rem,daily,done,daysLeft,finish,daysAhead,daysBehind};
}
function pActive(side){ return pList(side).filter(p=>!p.paused && (pPaid(side,p)<p.amount || (side==='buy'&&p.reopened))); }
function pInactive(side){ return pList(side).filter(p=>p.paused && pPaid(side,p)<p.amount); }
function pFull(side,p){ return pPaid(side,p)>=p.amount && !(side==='buy'&&p.reopened); }
// full, but I have not confirmed paying it out yet
function pPending(side){ return pList(side).filter(p=>pFull(side,p) && !p.cleared); }
// full AND confirmed cleared
function pDone(side){ return pList(side).filter(p=>pFull(side,p) && p.cleared); }
function clearPlan(side,id){
  const p=pList(side).find(x=>String(x.id)===String(id)); if(!p) return;
  p.cleared=true; p.clearedDate=TODAY; p.focus=false;
  if(side==='buy'){ saveBuy(); syncBuyListItem(p); renderWN(); } else saveGoals();
  renderDebt(); showToast("✅ Settled and recorded");
}
// restart the same plan from zero with a brand new target
function restartPlan(side,id){
  const p=pList(side).find(x=>String(x.id)===String(id)); if(!p) return;
  if(!confirm(`Restart "${p.label}" from zero?\n\nThis round is kept in your records and a fresh one starts at GH₵ 0.`)) return;
  // the finished round goes into the record exactly as it stands
  p.cleared=true; p.clearedDate=TODAY; p.focus=false;
  const fresh={ ...JSON.parse(JSON.stringify(p)), id:uid(side==='buy'?"buy_":"d_"),
    cleared:false, clearedDate:null, deadline:"", planStart:TODAY, planVer:PLAN_VER,
    paused:false, reopened:false, focus:false };
  if(side==='buy'){
    fresh.saved=0; fresh.log=[];
    delete fresh.sourceListId; delete fresh.sourceListIds;
    buyPlans.unshift(fresh); saveBuy(); syncBuyListItem(p); renderWN(); renderDebt();
    openBuyModal(fresh.id);
  } else {
    debtGoals.unshift(fresh); goalOrder.unshift(fresh.id);
    D().paid[fresh.id]=0;
    saveGoals(); saveOrder(); saveAll(); renderDebt();
    openEditModal(fresh.id);
  }
  showToast("🔄 Fresh round started, set the new date");

// Everything you log is written down with its date. The +/- reads
// those entries and nothing else, so an edit can never shift it.
function planLogTotal(o){
  const start=o.planStart||TODAY;
  let sum=0;
  if(Array.isArray(o.log)){
    for(const l of o.log){ if(!l.seed && (l.date||"")>=start) sum+=(l.amount||0); }
  } else {
    const master=(D().log)||[];
    for(const l of master){ if(l.goalId===o.id && (l.date||"")>=start) sum+=(l.amount||0); }
  }
  return sum;
}
// One payment = one scheduled amount (GH30/day, GH50/week...).
// Today's payment counts as due today, so paying exactly it = On track.
function paceUnits(o, paid, total){
  const amt=(o.planAmt>0)?o.planAmt:(o.planDaily||o.dailyTarget||0);
  if(!(amt>0)) return {units:0, short:0, word:'Day'};
  const per=(o.planFreq==='week')?7:1;
  const word=(o.planFreq==='week')?'Week':'Day';
  const elapsed=Math.max(daysBetween(o.planStart||TODAY,TODAY),0);
  // never count more than the plan actually holds
  const logged=Math.max(Math.min(planLogTotal(o), (paid||0)), 0);
  const stillOwed=Math.max((total||0)-((paid||0)-logged),0);
  const allPayments=Math.ceil(stillOwed/amt);
  const donePayments=logged/amt;
  // days/weeks that have fully finished - today is not one of them
  const dueFinished=Math.min(Math.floor(elapsed/per), allPayments);
  // including the one running now, used only to judge being ahead
  const dueNow=Math.min(dueFinished+1, allPayments);
  const behindBy=dueFinished-donePayments;
  if(behindBy>=1e-9) return {units:-Math.ceil(behindBy-1e-9), short:Math.round(behindBy*amt), word};
  const aheadBy=donePayments-dueNow;
  if(aheadBy>=1-1e-9) return {units:Math.floor(aheadBy+1e-9), short:0, word};
  return {units:0, short:0, word};
}
// kept for the tracker boxes, same numbers
function paceDaysOf(o, paid, total, daily){
  const u=paceUnits(o, paid, total);
  return {days:u.units, short:u.short};
}
function sideTracker(side){
  const act=pActive(side);
  let paid=0,amt=0,daily=0; const dates=new Set();
  let totAhead=0, totBehind=0, catchUpMoney=0;
  for(const p of act){ const pc=pPace(side,p); paid+=pc.paid; amt+=p.amount; daily+=pc.daily;
    const _pd=paceDaysOf(p, pc.paid, p.amount, Math.max(pDaily(side,p),1));
    if(_pd.days>0) totAhead+=_pd.days;
    else if(_pd.days<0){ totBehind+=-_pd.days; catchUpMoney+=_pd.short; }
    pLogs(side,p).forEach(l=>dates.add(l.date)); }
  const netDays=totAhead-totBehind;
  const daysAhead=netDays>0?netDays:0;
  const daysBehind=netDays<0?-netDays:0;
  const daysPaid=daily>0?Math.floor(paid/daily):0;
  const catchUp=Math.round(catchUpMoney);
  const dl=[...dates].sort(); let streak=0, cd=new Date(TODAY);
  while(true){ const ds=cd.toISOString().split("T")[0]; if(dl.includes(ds)){streak++;cd.setDate(cd.getDate()-1);}else break; }
  const dn=pDone(side);
  const doneAmt=dn.reduce((x,p)=>x+(p.amount||0),0);
  return {paid,amt,daily,daysAhead,daysBehind,daysPaid,catchUp,streak,activeCount:act.length,doneCount:dn.length,doneAmt};
}

// every log across Debt, Buy and Savings, gathered by date
function dtPaidByDate(){
  const map={};
  const add=(d,a)=>{ if(!d||!(a>0)) return; map[d]=(map[d]||0)+a; };
  for(const l of (D().log||[])) add(l.date, l.amount);
  for(const p of (buyPlans||[])) for(const l of (p.log||[])) if(!l.seed) add(l.date, l.amount);
  for(const g of (savGoals||[])) for(const l of (g.log||[])) if(!l.seed) add(l.date, l.amount);
  return map;
}
function dtPaidToday(){ return dtPaidByDate()[TODAY]||0; }
// Each day converts into "days covered" at the rate that applied THAT day,
// so changing the rate never rewrites what you already earned.
function dtStats(){
  const paid=dtPaidByDate();
  const start=dtStart();
  const days=Math.max(daysBetween(start,TODAY),0)+1;
  let units=0, unitsFinished=0, missed=0;
  const cur=new Date(start);
  for(let i=0;i<days;i++){
    const ds=cur.toISOString().split("T")[0];
    const need=dtRateOn(ds);
    const got=paid[ds]||0;
    if(need>0){ units+=got/need; if(ds<TODAY) unitsFinished+=got/need; }
    if(ds<TODAY && got<need) missed++;
    cur.setDate(cur.getDate()+1);
  }
  // one ruler: every scheduled amount logged counts as +1.
  // days that have finished unpaid pull it down by 1 each.
  const daysFinished=Math.max(days-1,0);
  const balance=units-daysFinished;
  const behind=balance<=-1e-9?Math.ceil(-balance-1e-9):0;
  const ahead=balance>=1-1e-9?Math.floor(balance+1e-9):0;
  // streak: unbroken run of met days. Today counts once you hit it,
  // and an unpaid today does not break a run that is still alive.
  let streak=0; const cd=new Date(TODAY);
  if(((paid[TODAY]||0) < dtRateOn(TODAY))) cd.setDate(cd.getDate()-1);
  while(true){
    const ds=cd.toISOString().split("T")[0];
    if(ds<start) break;
    const need=dtRateOn(ds), got=paid[ds]||0;
    if(got>=need && need>0){ streak++; cd.setDate(cd.getDate()-1); } else break;
  }
  const todayNeed=dtRateToday(), todayGot=paid[TODAY]||0;
  return {units, days, ahead, behind, streak, missed,
          todayNeed, todayGot,
          todayLeft:Math.max(todayNeed-todayGot,0),
          rate:todayNeed};
}
function dtRemainingAll(){
  let rem=0;
  for(const g of (debtGoals||[])){ if(g.paused) continue; const left=(g.amount||0)-(D().paid[g.id]||0); if(left>0) rem+=left; }
  for(const p of (buyPlans||[])){ if(p.paused) continue; const left=(p.amount||0)-(p.saved||0); if(left>0) rem+=left; }
  for(const g of (savGoals||[])){ if(g.completed) continue; const left=(g.target||0)-(g.saved||0); if(left>0) rem+=left; }
  return rem;
}
function dtDaysToClear(){
  const rate=dtRateToday(), rem=dtRemainingAll();
  if(!(rate>0)||rem<=0) return 0;
  return Math.ceil(rem/rate);
}

// ---- merge several plans into one ----
let mergeMode=null, mergePicked={};
function toggleMergeMode(side){
  mergeMode = (mergeMode===side)?null:side;
  mergePicked={};
  renderDebt();
}
function mergePick(id){ mergePicked[id]=!mergePicked[id]; renderDebt(); }
function mergePickedPlans(side){ return pActive(side).filter(p=>mergePicked[p.id]); }
function mergeGo(side){
  const picks=mergePickedPlans(side);
  if(picks.length<2){ showToast("Pick at least 2 to merge","#FF453A"); return; }
  const el=document.getElementById("mergeName");
  const name=(el&&el.value.trim())||`${picks.length} merged`;
  const total=picks.reduce((s,p)=>s+(p.amount||0),0);
  const paid=picks.reduce((s,p)=>s+pPaid(side,p),0);
  // keep every line item, and every payment already made
  let items=[], logs=[], listIds=[];
  for(const p of picks){
    if(p.items&&p.items.length) items=items.concat(p.items);
    else items.push({name:p.label, amount:p.amount||0});
    listIds=listIds.concat(planListIds(p));
    if(side==='buy'){ for(const l of (p.log||[])) logs.push({date:l.date,amount:l.amount}); }
    else { for(const l of (D().log||[])) if(l.goalId===p.id) logs.push({date:l.date,amount:l.amount}); }
  }
  const deadline=picks.map(p=>p.deadline).filter(Boolean).sort()[0]||"";
  const g=genPlan(Math.max(total-paid,0), deadline, picks[0].planFreq||'day');
  const base={ label:name, amount:total, color:picks[0].color,
    planDaily:g.planDaily, planAmt:g.planAmt, planFreq:g.planFreq, deadline,
    paused:false, planStart:TODAY, planVer:PLAN_VER, items };
  if(side==='buy'){
    const np={ id:uid("buy_"), note:"", saved:paid, log:logs, ...base };
    if(listIds.length) np.sourceListIds=listIds;
    buyPlans=buyPlans.filter(p=>!mergePicked[p.id]);
    buyPlans.unshift(np);
    saveBuy(); syncBuyListItem(np); renderWN();
  } else {
    const nid=uid("d_");
    const ng={ id:nid, person:"", ...base };
    debtGoals=debtGoals.filter(p=>!mergePicked[p.id]);
    debtGoals.unshift(ng);
    goalOrder=[nid, ...goalOrder.filter(x=>!mergePicked[x])];
    D().log=(D().log||[]).filter(l=>!mergePicked[l.goalId]);
    for(const l of logs) D().log.push({date:l.date, goalId:nid, amount:l.amount, label:name});
    for(const k of Object.keys(mergePicked)) if(mergePicked[k]) delete D().paid[k];
    D().paid[nid]=paid;
    saveGoals(); saveOrder(); saveAll();
  }
  mergeMode=null; mergePicked={};
  renderDebt();
  showToast(`📦 Merged ${picks.length} into "${name}"`);
}
function mergeBarHTML(side){
  const picks=mergePickedPlans(side);

// ---- logging ----
let _rolled=null;
function logToPlan(side,id,amount){
  const amt=parseFloat(amount);
  if(!amt||amt<=0){ showToast("Enter a valid amount","#FF453A"); return; }
  _rolled=null;
  if(side==='buy'){
    const p=buyPlans.find(x=>String(x.id)===String(id)); if(!p) return;
    const room=p.amount-(p.saved||0); const pay=Math.min(amt,room);
    p.saved=(p.saved||0)+pay; p.log=p.log||[]; p.log.push({date:TODAY,amount:pay});
    if(p.focus && p.saved>=p.amount && p.cleared) _rolled={side:'buy',from:p,to:rollFocusOn('buy',p)};
    syncBuyListItem(p);
    saveBuy();
    showToast(`✅ GH₵${pay} logged to ${p.label}`);
  } else {
    const g=debtGoals.find(x=>String(x.id)===String(id)); if(!g) return;
    const room=g.amount-(D().paid[id]||0); const pay=Math.min(amt,room);
    D().paid[id]=(D().paid[id]||0)+pay; D().log.push({date:TODAY,goalId:id,amount:pay,label:g.label});
    if(g.focus && (D().paid[id]||0)>=g.amount && g.cleared) _rolled={side:'debt',from:g,to:rollFocusOn('debt',g)};
    goalOrder=[id,...goalOrder.filter(x=>x!==id)]; saveOrder(); saveAll();
    showToast(`✅ GH₵${pay} logged to ${g.label}`);
  }
  renderDebt(); renderWN();
  if(_rolled){
    const freed=Math.round(_rolled.from.planAmt||_rolled.from.planDaily||_rolled.from.dailyTarget||0);
    const per=(_rolled.from.planFreq||'day');
    const _fn=_rolled.from.label||_rolled.from.name, _tn=_rolled.to?(_rolled.to.label||_rolled.to.name):"";
    if(_rolled.to) setTimeout(()=>showToast(`🎯 ${_fn} cleared! Roll that GH₵ ${freed}/${per} into ${_tn}`,"#30D158"),1400);
    else setTimeout(()=>showToast("🎉 That was the last one. All clear!","#30D158"),1400);
    _rolled=null;
  }
}

let logPickSide='debt', logPickAmount=0;
let logPickPool=0, logPickTotal=0, logPickHits=0;
function pickerList(side){ return side==='sav' ? savActiveGoals() : pActive(side); }
function pickerName(o){ return o.label||o.name||""; }
function pickerLeft(side,o){ return side==='sav' ? Math.max((o.target||0)-(o.saved||0),0) : Math.max((o.amount||0)-pPaid(side,o),0); }
function openLogPicker(side,amount){
  logPickSide=side; logPickTotal=parseFloat(amount)||0; logPickPool=logPickTotal; logPickHits=0;
  if(pickerList(side).length===0){ showToast("No active plans to log","#FF453A"); return; }
  if(logPickTotal<=0){ showToast("Enter valid amount","#FF453A"); return; }
  renderLogPicker();
  document.getElementById("logPickModal").classList.add("open");
}
function renderLogPicker(){
  const side=logPickSide;
  const list=pickerList(side);
  const accent=side==='buy'?'#BF5AF2':side==='sav'?'#32ADE6':'#FF453A';
  document.getElementById("logPickTitle").textContent="Share GH₵ "+logPickTotal.toLocaleString();
  const sub=document.getElementById("logPickSub");
  if(sub) sub.innerHTML=`<b style="color:${logPickPool>0?'#30D158':'#A0A0A0'};font-size:14px">GH₵ ${Math.round(logPickPool).toLocaleString()} left to share</b><br>Tap a plan to give it money. Tap as many as you like, or the same one twice.`;
  document.getElementById("logPickList").innerHTML=list.map(p=>{
    const paid=side==='sav'?(p.saved||0):pPaid(side,p);
    const total=side==='sav'?p.target:p.amount;
    const step=Math.min(quickAmt(side,p), logPickPool);
    const rest=Math.min(pickerLeft(side,p), logPickPool);
    return `<div style="background:#161616;border:1px solid ${p.color}55;border-radius:12px;padding:12px 13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div style="min-width:0;flex:1"><div style="font-size:14px;font-weight:700;color:#fff">${pickerName(p)}</div>
      <div style="font-size:11px;color:#A0A0A0">GH₵ ${paid.toLocaleString()} / ${total.toLocaleString()} · ${Math.round(p.planAmt>0?p.planAmt:(p.dailyTarget||pDaily(side,p))).toLocaleString()}/${p.planFreq||'day'}</div></div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        ${step>0?`<button onclick="logPickGive('${p.id}','step')" style="padding:8px 11px;border-radius:9px;background:${p.color};border:none;color:#0A0A0A;font-size:12px;font-weight:800;cursor:pointer;font-family:'Outfit',sans-serif">＋ ${Math.round(step).toLocaleString()}</button>`:''}
        ${rest>0?`<button onclick="logPickGive('${p.id}','rest')" style="padding:8px 11px;border-radius:9px;background:#161616;border:1px solid ${p.color};color:${p.color};font-size:12px;font-weight:800;cursor:pointer;font-family:'Outfit',sans-serif">All ${Math.round(rest).toLocaleString()}</button>`:''}
      </div></div>`;
  }).join("");
  const dn=document.getElementById("logPickDone");
  if(dn){ dn.textContent=logPickHits>0?"Done":"Cancel"; dn.style.color=logPickHits>0?'#30D158':'#E5E5E5'; }
}
function logPickGive(id, mode){
  const side=logPickSide;
  const o=(side==='sav'?savGoals:pList(side)).find(x=>String(x.id)===String(id)); if(!o) return;
  const want = mode==='rest' ? logPickPool : quickAmt(side,o);
  const amt=Math.min(want, logPickPool, pickerLeft(side,o));
  if(amt<=0){ showToast("Nothing to add there","#FF9F0A"); return; }
  logPickPool=Math.max(logPickPool-amt,0); logPickHits++;
  if(side==='sav') addToSavGoal(id,amt); else logToPlan(side,id,amt);
  if(logPickPool<=0.009){ finishLogPicker(); } else { renderLogPicker(); }
}
function finishLogPicker(){
  const spent=logPickTotal-logPickPool, hits=logPickHits;
  closeLogPicker();
  if(hits>1) setTimeout(()=>showToast(`✅ GH₵ ${Math.round(spent).toLocaleString()} shared across ${hits} logs`,"#30D158"),700);

  logPickPool=0; logPickTotal=0; logPickHits=0; logPickAmount=0;
}
let inlineLogSide=null, inlineLogId=null;
// the plan's own scheduled amount, never more than what is still left
function quickAmt(side,o){
  if(side==='sav'){
    const left=Math.max((o.target||0)-(o.saved||0),0);
    const a=(o.planAmt>0?o.planAmt:(o.dailyTarget||0));
    return Math.min(a>0?a:0, left);
  }
  const left=Math.max((o.amount||0)-pPaid(side,o),0);
  const a=(o.planAmt>0?o.planAmt:Math.round(pDaily(side,o)||0));
  return Math.min(a>0?a:0, left);
}
function quickLog(side,id){
  const o=(side==='sav'?savGoals:pList(side)).find(x=>String(x.id)===String(id)); if(!o) return;
  const a=quickAmt(side,o);
  if(a<=0){ showToast("Nothing left to log here","#FF9F0A"); return; }
  if(side==='sav') addToSavGoal(id,a); else logToPlan(side,id,a);
}
// countdown to the target date (like Debt): days left, or X days overdue
function roundClean(x){
  x=Math.max(0,x||0);
  if(x<=0) return 0;
  const step = x<200 ? 5 : x<1000 ? 25 : 50;
  return Math.max(5, Math.ceil(x/step)*step);
}
function genPlan(remaining, deadline, freq){
  freq=freq||'day';
  remaining=Math.max(remaining||0,0);
  if(!deadline || remaining<=0){ return {planDaily:0, planAmt:0, planFreq:freq}; }
  const daysUntil=Math.max(deadlineDaysLeft(deadline)||0, 1);
  if(freq==='week'){
    const weeks=Math.max(Math.ceil(daysUntil/7),1);
    const perWeek=roundClean(remaining/weeks);
    return {planDaily:perWeek/7, planAmt:perWeek, planFreq:'week'};
  }
  const perDay=roundClean(remaining/daysUntil);
  return {planDaily:perDay, planAmt:perDay, planFreq:'day'};
}
function longDate(ds){
  if(!ds) return "";
  const d=new Date(ds);
  if(isNaN(d.getTime())) return "";
  const W=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return W[d.getUTCDay()]+" "+d.getUTCDate()+" "+M[d.getUTCMonth()]+" "+d.getUTCFullYear();
}
function quickDate(inputId, kind, refresh){
  const d=new Date(TODAY);
  if(kind==='w1') d.setUTCDate(d.getUTCDate()+7);
  else if(kind==='w2') d.setUTCDate(d.getUTCDate()+14);
  else if(kind==='eom'){ d.setUTCMonth(d.getUTCMonth()+1); d.setUTCDate(0); }
  else if(kind==='m1') d.setUTCMonth(d.getUTCMonth()+1);
  else if(kind==='m3') d.setUTCMonth(d.getUTCMonth()+3);
  const el=document.getElementById(inputId); if(!el) return;
  el.value=d.toISOString().split("T")[0];
  if(refresh==='updateBuyPreview') updateBuyPreview();
  else if(refresh==='updateSavPreview') updateSavPreview();
  else updateDebtPreview();
}
function quickDateRow(inputId, refresh){
  const b=(k,t)=>`<button type="button" onclick="quickDate('${inputId}','${k}','${refresh}')" style="padding:6px 10px;border-radius:8px;background:#161616;border:1px solid #333;color:#E5E5E5;font-size:11px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif">${t}</button>`;
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 10px">${b('w1','1 week')}${b('w2','2 weeks')}${b('eom','End of month')}${b('m1','1 month')}${b('m3','3 months')}</div>`;
}
function shortDate(ds){
  if(!ds) return "";
  const d=new Date(ds);
  if(isNaN(d.getTime())) return "";
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate()+" "+M[d.getMonth()];
}
function planPreviewText(remaining, dateVal, freqVal, verb){
  if(!dateVal) return "Pick a target date and the amount is worked out for you";
  const dl=deadlineDaysLeft(dateVal);
  if(dl===null) return "";
  if(dl<0) return "\u26A0\uFE0F That date has already passed";
  if(remaining<=0) return "Nothing left to "+verb.toLowerCase();
  const g=genPlan(remaining, dateVal, freqVal);
  const days=Math.max(dl,1);
  return "\uD83D\uDCA1 "+verb+" GH\u20B5 "+g.planAmt.toLocaleString()+" every "+(g.planFreq==='week'?'week':'day')+" \u00B7 "+days+" day"+(days!==1?'s':'')+" to go \u00B7 ends "+longDate(dateVal);
}

function planDaysInfo(deadline, remaining, daily, anchor, amount){
  daily=daily>0?daily:1;
  let dl;
  if(deadline){ dl=deadlineDaysLeft(deadline); }
  else { dl=Math.ceil(amount/daily)-Math.max(daysBetween(anchor,TODAY),0); }
  if(dl===null||dl===undefined){ const n=Math.ceil(remaining/daily); return {text:`${n} day${n!==1?'s':''} left`,color:n<=3?'#FF453A':n<=10?'#FF9F0A':'#30D158'}; }
  if(dl<0) return {text:`${Math.abs(dl)} day${Math.abs(dl)!==1?'s':''} overdue`, color:'#FF453A'};
  return {text:`${dl} day${dl!==1?'s':''} left`, color:dl<=3?'#FF453A':dl<=10?'#FF9F0A':'#30D158'};
}
// per-plan pace: +X ahead (green) / -X behind (red) / on track
function planPaceInfo(paid, daily, anchor, amount){
  daily=daily>0?daily:1;
  const elapsed=Math.max(daysBetween(anchor,TODAY),0);
  const expected=Math.min(elapsed*daily, amount);
  const net=paid-expected;
  if(net>=daily-0.0001){ const d=Math.floor(net/daily+0.0001); return {text:`+${d} Day${d!==1?'s':''}`, color:'#30D158'}; }
  if(net<=-daily+0.0001){ const d=Math.ceil(-net/daily-0.0001); return {text:`-${d} Day${d!==1?'s':''}`, color:'#FF453A'}; }
  return {text:'On track', color:'#A0A0A0'};
}

let buyEditId=null, buySelColor=COLORS[6], buyFromListId=null, buyPresetItems=null, buyAgain=false;
function openBuyModal(editId, preset, fromListId){
  buyEditId=editId||null;
  buyFromListId=fromListId||null;
  buyPresetItems=(preset&&preset.items)?preset.items:null;
  const t=document.getElementById("buyModalTitle");
  if(buyEditId){
    const p=buyPlans.find(x=>x.id===buyEditId);

    document.getElementById("buyModalNote").value=p.note||"";

    document.getElementById("buyModalSaved").value=p.saved||0;
    document.getElementById("buyModalDate").value=p.deadline||"";
    document.getElementById("buyModalFreq").value=p.planFreq||"day";
  } else {
    buySelColor=(preset&&preset.color)?preset.color:COLORS[Math.floor(Math.random()*COLORS.length)]; t.textContent=(preset&&preset.again)?"🔁 Add Again: New Buy Plan":"🛒 New Buy Plan";
    document.getElementById("buyModalName").value=preset&&preset.name?preset.name:"";
    document.getElementById("buyModalNote").value=preset&&preset.note?preset.note:"";
    document.getElementById("buyModalAmount").value=preset&&preset.price?preset.price:"";
    document.getElementById("buyModalSaved").value="";
    document.getElementById("buyModalDate").value="";
    document.getElementById("buyModalFreq").value=(preset&&preset.freq)?preset.freq:"day";
  }
  buyAgain=!!(preset&&preset.again);
  buildColorPicker("buyColorPicker", buySelColor);
  paintQuickDates(); updateBuyPreview();
  document.getElementById("buyModal").classList.add("open");
}
function closeBuyModal(){ document.getElementById("buyModal").classList.remove("open"); buyEditId=null; buyFromListId=null; buyAgain=false; }
function saveBuyModal(){
  const name=document.getElementById("buyModalName").value.trim();
  const note=document.getElementById("buyModalNote").value.trim();
  const amount=parseFloat(document.getElementById("buyModalAmount").value);
  const saved=parseFloat(document.getElementById("buyModalSaved").value)||0;
  const bdate=document.getElementById("buyModalDate").value||"";
  const bfreq=document.getElementById("buyModalFreq").value||"day";
  if(!name||!amount||amount<=0){ showToast("Name and amount required","#FF453A"); return; }
  const _bg=genPlan(amount-Math.min(saved,amount), bdate, bfreq);
  let planDaily=_bg.planDaily; const deadline=bdate;
  if(buyEditId){
    const p=buyPlans.find(x=>x.id===buyEditId);
    if(p){
      const fresh=replanned(p, amount, deadline, _bg.planFreq, _bg.planAmt);
      p.label=name; p.note=note; p.amount=amount; p.color=buySelColor; p.planDaily=planDaily; p.planAmt=_bg.planAmt; p.planFreq=_bg.planFreq; p.deadline=deadline;
      p.saved=Math.min(saved,amount);
      if(fresh || !p.planStart) p.planStart=TODAY;
      p.planVer=PLAN_VER; p.reopened=false; syncBuyListItem(p);
    }
    showToast("✅ Buy plan updated!");
  } else {
    const id=uid("buy_");
    const np={ id, label:name, note, amount, color:buySelColor, planDaily, planAmt:_bg.planAmt, planFreq:_bg.planFreq, deadline, paused:false, saved:Math.min(saved,amount), log:[], planStart:TODAY, planBase:Math.min(saved,amount), planVer:PLAN_VER };
    if(saved>0) np.log.push({date:TODAY,amount:Math.min(saved,amount),seed:true});
    buyPlans.unshift(np);
    if(buyPresetItems&&buyPresetItems.length){ np.items=buyPresetItems; buyPresetItems=null; }
    if(buyFromListId){
      if(Array.isArray(buyFromListId)) np.sourceListIds=buyFromListId; else np.sourceListId=buyFromListId;
      buyFromListId=null; syncBuyListItem(np);
    }
    showToast(buyAgain?"🔁 Added again. Old one kept in records":"✅ Buy plan added!");
  }
  saveBuy(); closeBuyModal(); planSide='buy'; renderDebt(); renderWN();
}

function getWeekRange(){ const now=new Date(),day=now.getDay(); const monday=new Date(now); monday.setDate(now.getDate()-((day+6)%7)); const sunday=new Date(monday); sunday.setDate(monday.getDate()+6); return{start:monday.toISOString().split("T")[0],end:sunday.toISOString().split("T")[0]}; }

  const savE=savGoals.flatMap(g=>(g.log||[]).map(l=>({id:'s'+l.date+g.id,date:l.date,desc:g.name,cat:'sav',amount:l.amount,auto:true})));

function periodRange(){
  const labels={week:"This Week",month:"This Month",year:"This Year",lifetime:"Lifetime"};
  const label=labels[spendPeriod]||"This Week";
  const d=new Date(TODAY);
  if(spendPeriod==="lifetime") return {from:"",to:"",label};
  if(spendPeriod==="year")  return {from:TODAY.slice(0,4)+"-01-01", to:"", label};
  if(spendPeriod==="month") return {from:TODAY.slice(0,7)+"-01", to:"", label};
  const day=d.getUTCDay(), back=(day===0?6:day-1);
  d.setUTCDate(d.getUTCDate()-back);
  return {from:d.toISOString().split("T")[0], to:"", label};
}

function closeSavModal(){ document.getElementById("savModal").classList.remove("open"); savModalEditId=null; savAgainFrom=null; }
function saveSavModal(){
  const name=document.getElementById("savModalName").value.trim();
  const target=parseFloat(document.getElementById("savModalTarget").value);
  const sdate=document.getElementById("savModalDate").value||"";
  const sfreq=document.getElementById("savModalFreq").value||"day";
  const sSaved=Math.max(parseFloat(document.getElementById("savModalSaved").value)||0,0);
  if(!name||!target||target<=0){showToast("Name and target required","#FF453A");return;}
  if(savModalEditId){
    const g=savGoals.find(x=>x.id===savModalEditId);
    if(g){
      g.saved=Math.min(sSaved,target);
      const _g=genPlan(target-g.saved,sdate,sfreq);
      const fresh=replanned(g, target, sdate, _g.planFreq, _g.planAmt);
      g.name=name;g.target=target;g.dailyTarget=_g.planDaily;g.planAmt=_g.planAmt;g.planFreq=_g.planFreq;g.deadline=sdate;g.color=savSelectedColor;
      if(fresh || !g.planStart) g.planStart=TODAY;
      g.planVer=PLAN_VER;
    }
    showToast("✅ Goal updated!");
  } else {
    const newId=uid("sav_");
    const start=Math.min(sSaved,target);
    const _g=genPlan(target-start,sdate,sfreq);
    const ng={id:newId,name,target,dailyTarget:_g.planDaily,planAmt:_g.planAmt,planFreq:_g.planFreq,deadline:sdate,saved:start,log:[],color:savSelectedColor,planStart:TODAY,planBase:start,planVer:PLAN_VER};
    if(start>0) ng.log.push({date:TODAY,amount:start,seed:true});
    savGoals.unshift(ng);
    savOrder.unshift(newId);
    if(savAgainFrom){ const og=savGoals.find(x=>String(x.id)===String(savAgainFrom)); if(og) og.focus=false; }
    showToast(savAgainFrom?"🔄 New goal started. Old one kept in records":"✅ Savings goal added!");
  }
  saveSavGoals(); saveSavOrder(); closeSavModal(); renderSavings();
}
function deleteSavGoal(id){
  const g=savGoals.find(x=>String(x.id)===String(id)); if(!g) return;
  if(!confirm(`Delete "${g.name}"?`)) return;
  keepSpent('sav', g.name, g.log);
  savGoals=savGoals.filter(x=>x.id!==id);
  savOrder=savOrder.filter(x=>x!==id);
  saveSavGoals(); saveSavOrder(); showToast("🗑 Goal removed"); renderSavings();
}
function addToSavGoal(id, amount){
  const amt=parseFloat(amount); if(!amt||amt<=0) return;
  const g=savGoals.find(x=>String(x.id)===String(id)); if(!g) return;
  const actual=Math.min(amt, g.target-g.saved);
  if(actual<=0){showToast("Goal already reached!","#FF9F0A");return;}
  g.saved+=actual;
  g.log.push({date:TODAY,amount:actual});
  let rolled=null;
  if(g.focus && g.saved>=g.target) rolled={from:g,to:rollFocusOn('sav',g)};
  saveSavGoals(); savingsAddingId=null; renderSavings();
  showToast(`✅ GH₵${actual} saved!`);
  if(rolled){
    const freed=Math.round(g.planAmt||g.dailyTarget||0), per=(g.planFreq||'day');
    if(rolled.to) setTimeout(()=>showToast(`🎯 ${g.name} reached! Roll that GH₵ ${freed}/${per} into ${rolled.to.name}`,"#30D158"),1400);
    else setTimeout(()=>showToast("🎉 Every savings goal reached!","#30D158"),1400);
  }
}

// ===== WEEKLY =====
function getWeekDates(offset){ const now=new Date(),day=now.getDay(); const monday=new Date(now); monday.setDate(now.getDate()-((day+6)%7)+(offset*7)); const sunday=new Date(monday); sunday.setDate(monday.getDate()+6); return{start:monday,end:sunday,label:`${monday.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${sunday.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`}; }
function isoDate(d){ return d.toISOString().split("T")[0]; }
// ===== BUDGET TAB (monthly planner + subscriptions) =====
const BUDGET_KEY="pfhub_budget_v1";
const SUBS_KEY="pfhub_subs_v1";
function loadBudgets(){ try{const r=localStorage.getItem(BUDGET_KEY);if(r)return JSON.parse(r);}catch(e){} return {}; }
function saveBudgets(){ localStorage.setItem(BUDGET_KEY,JSON.stringify(budgets)); }
let budgets=loadBudgets();
function loadSubs(){ try{const r=localStorage.getItem(SUBS_KEY);if(r)return JSON.parse(r);}catch(e){} return []; }
function saveSubs(){ localStorage.setItem(SUBS_KEY,JSON.stringify(subs)); }
let subs=loadSubs();
const SUB_ORDER_KEY="pfhub_sub_order_v1";
function loadSubOrder(){ try{const r=localStorage.getItem(SUB_ORDER_KEY);if(r)return JSON.parse(r);}catch(e){} return []; }
function saveSubOrder(){ localStorage.setItem(SUB_ORDER_KEY,JSON.stringify(subOrder)); }
let subOrder=loadSubOrder();
function syncSubOrder(){
  const ids=subs.map(s=>s.id);
  subOrder=subOrder.filter(id=>ids.includes(id));
  for(const id of ids){ if(!subOrder.includes(id)) subOrder.push(id); }
  saveSubOrder();
}
function bumpSubToTop(id){ syncSubOrder(); subOrder=[id,...subOrder.filter(x=>x!==id)]; saveSubOrder(); }
function getOrderedActiveSubs(){ syncSubOrder(); const active=subs.filter(s=>!s.cancelled); return subOrder.map(id=>active.find(s=>s.id===id)).filter(Boolean); }
let selBudgetMonth=TODAY.slice(0,7);
let budgetAddingId=null, budgetExpandedId=null, subModalEditId=null;

const PLAN_KEY="pfhub_plan_v1";
function loadPlan(){ try{const r=localStorage.getItem(PLAN_KEY); if(r!==null&&r!=="") return parseFloat(r)||0;}catch(e){} return 0; }
function savePlan(){ localStorage.setItem(PLAN_KEY, String(monthlyPlan)); }
let monthlyPlan=loadPlan();
function setMonthlyPlan(){
  const v=prompt("Monthly plan — how much do you plan to spend per month? (GH₵)", monthlyPlan||0);
  if(v===null) return;
  monthlyPlan=parseFloat(v)||0;
  savePlan(); renderBudget(); showToast("✅ Monthly plan set!");
}

function monthLabel(ym){ const p=ym.split("-"); return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }
function shiftMonth(ym,delta){ const p=ym.split("-"); const d=new Date(+p[0],+p[1]-1+delta,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function budgetCats(){ return spendCats.filter(c=>!['debt','sav','wants','needs','subs'].includes(c.id)); }
function entriesForCatMonth(catId,ym){ return spendData.entries.filter(e=>e.cat===catId&&(e.date||"").slice(0,7)===ym); }
function catArchived(catId){
  let t=0;
  for(const yr of Object.keys(archiveData||{})){
    const c=archiveData[yr]&&archiveData[yr].cats;
    if(c&&c[catId]) t+=c[catId];
  }
  return t;
}
function catSpentAll(catId){
  return (spendData.entries||[]).filter(e=>e.cat===catId).reduce((s,e)=>s+(e.amount||0),0) + catArchived(catId);
}
function catEntriesAll(catId){ return (spendData.entries||[]).filter(e=>e.cat===catId); }
function catSpentMonth(catId,ym){ return entriesForCatMonth(catId,ym).reduce((s,e)=>s+e.amount,0); }
function subPaidThisMonth(subId,ym){ return spendData.entries.some(e=>e.cat==="subs"&&e.sub===subId&&(e.date||"").slice(0,7)===ym); }
function subsTotalMonthly(){ return subs.filter(x=>!x.cancelled).reduce((s,x)=>s+(x.amount||0),0); }

function setCatBudget(catId){
  const cat=getCat(catId); const cur=budgets[catId]||0;
  const v=prompt("Monthly budget for "+cat.label+" (GH₵). Enter 0 for none.", cur);
  if(v===null) return;
  const n=parseFloat(v)||0;
  if(n>0) budgets[catId]=n; else delete budgets[catId];
  saveBudgets(); renderBudget();
}
function logBudgetSpend(catId,amount,desc){
  const amt=parseFloat(amount); if(!amt||amt<=0){showToast("Enter an amount","#FF453A");return;}
  const cur=TODAY.slice(0,7);
  const date=selBudgetMonth===cur?TODAY:selBudgetMonth+"-15";
  spendData.entries.push({id:uid("sp_"),date,desc:(desc&&desc.trim())||getCat(catId).label,cat:catId,amount:amt});
  saveSpend(); budgetAddingId=null; renderBudget(); showToast("✅ Logged!");
}

function openSubModal(editId){
  subModalEditId=editId||null;
  const s=editId?subs.find(x=>x.id===editId):null;
  document.getElementById("subModalTitle").textContent=editId?"✏️ Edit Subscription":"🔁 New Subscription";
  document.getElementById("subModalName").value=s?s.name:"";
  document.getElementById("subModalAmount").value=s?s.amount:"";
  document.getElementById("subModalDeadline").value=s&&s.deadline?s.deadline:"";
  document.getElementById("subModal").classList.add("open");
}
function closeSubModal(){ document.getElementById("subModal").classList.remove("open"); subModalEditId=null; }
function saveSubModal(){
  const name=document.getElementById("subModalName").value.trim();
  const amount=parseFloat(document.getElementById("subModalAmount").value)||0;
  const deadline=document.getElementById("subModalDeadline").value||"";
  if(!name||amount<=0){showToast("Name and amount required","#FF453A");return;}
  if(subModalEditId){ const s=subs.find(x=>x.id===subModalEditId); if(s){s.name=name;s.amount=amount;s.deadline=deadline;} showToast("✅ Updated!"); }
  else { subs.push({id:uid("sub_"),name,amount,deadline}); showToast("✅ Subscription added!"); }
  saveSubs(); closeSubModal(); renderBudget();
}
function deleteSub(id){
  const s=subs.find(x=>String(x.id)===String(id)); if(!s) return;
  if(!confirm('Remove "'+s.name+'" from your subscriptions?')) return;
  subs=subs.filter(x=>x.id!==id); saveSubs(); syncSubOrder(); renderBudget(); showToast("🗑 Removed");
}

function renderBudget(){
  const ym=selBudgetMonth;
  const cats=budgetCats();
  const catsSpent=cats.reduce((s,c)=>s+catSpentMonth(c.id,ym),0);
  const subsM=subsTotalMonthly();
  const spent=catsSpent+((ym===TODAY.slice(0,7))?subsM:0);
  const planned=monthlyPlan;
  const left=planned-spent;
  const cur=TODAY.slice(0,7);
  document.getElementById("page-budget").innerHTML=`
    <div style="margin-top:10px">
    <div class="week-nav">
      <button class="week-nav-btn" onclick="selBudgetMonth=shiftMonth(selBudgetMonth,-1);renderBudget()">‹ Prev</button>
      <span class="week-label">${monthLabel(ym)}</span>
      <button class="week-nav-btn" onclick="selBudgetMonth=shiftMonth(selBudgetMonth,1);renderBudget()" style="opacity:${ym<cur?1:0.5}">Next ›</button>
    </div>

    <div class="card" style="border-color:#E5E5E522">
      <div class="row" style="margin-bottom:6px"><span class="label-sm">Planned</span><span style="color:#30D158;font-weight:800;font-size:13px">GH₵ ${planned.toLocaleString()}</span></div>
      <div class="row" style="margin-bottom:${(subsM>0&&ym===TODAY.slice(0,7))?2:8}px"><span class="label-sm">Spent</span><span style="color:#FF453A;font-weight:800;font-size:13px">GH₵ ${spent.toLocaleString()}</span></div>
      ${(subsM>0&&ym===TODAY.slice(0,7))?`<div style="font-size:10px;color:#E5E5E5;text-align:right;margin-bottom:8px">includes GH₵ ${subsM.toLocaleString()} subscriptions</div>`:''}
      <div class="bar-wrap"><div class="bar-fill" style="width:${planned>0?Math.min((spent/planned)*100,100):0}%;background:${spent>planned&&planned>0?'#FF453A':'linear-gradient(90deg,#E5E5E5,#30D158)'}"></div></div>
      <div class="row" style="margin-top:8px"><span class="val-muted">${planned>0?(spent>planned?'Over plan':'On plan'):'No plan set'}</span><span style="color:${left<0?'#FF453A':'#30D158'};font-weight:700;font-size:13px">GH₵ ${left.toLocaleString()} left</span></div>
      <button onclick="setMonthlyPlan()" style="width:100%;margin-top:12px;padding:10px;border-radius:10px;background:#1E1E1E;border:1px solid #E5E5E544;color:#E5E5E5;font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif">${planned>0?'✏️ Edit Monthly Plan':'➕ Set Monthly Plan'}</button>
    </div>

    <div class="section-title">📂 Spending Categories</div>
    ${cats.map(cat=>{
      const t=catSpentMonth(cat.id,ym);
      const open=budgetExpandedId===cat.id;
      const ents=entriesForCatMonth(cat.id,ym);
      return `<div class="card" style="padding:14px 16px;border-color:${cat.color}22">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div onclick="budgetExpandedId=budgetExpandedId==='${cat.id}'?null:'${cat.id}';renderBudget()" style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0">
            <span style="font-size:22px">${cat.icon}</span>
            <div style="min-width:0">
              <div style="font-size:14px;font-weight:700;color:${cat.color}">${cat.label}</div>
              ${(function(){const moneyIn=catMoneyIn(cat.id,ym); if(!moneyIn) return `<div style="font-size:11px;color:#E5E5E5">GH₵ ${t.toLocaleString()} spent${ents.length?` · ${ents.length} entr${ents.length===1?'y':'ies'}`:''}</div>`;

        spendCats = spendCats.filter(x=>!(x.label==="Savings" && x.id!=="sav"));

        });

      }
      if(parsed.budgets){budgets=parsed.budgets;saveBudgets();}
      if(parsed.monthlyPlan!==undefined){monthlyPlan=parsed.monthlyPlan;savePlan();}
      if(parsed.subs){subs=parsed.subs;saveSubs();}
      if(parsed.archive){archiveData=parsed.archive;saveArchive();}
      if(parsed.subOrder){subOrder=parsed.subOrder;saveSubOrder();}

      if(parsed.dailyTarget&&Array.isArray(parsed.dailyTarget.rates)&&parsed.dailyTarget.rates.length){dailyTarget=parsed.dailyTarget;saveDT();}
      if(parsed.incomeData&&Array.isArray(parsed.incomeData.entries)){incomeData=parsed.incomeData;saveIncome();}
      if(parsed.sentData&&Array.isArray(parsed.sentData.entries)){sentData=parsed.sentData;saveSent();}
      if(parsed.dest){dest=parsed.dest;saveDest();}
      if(parsed.catIn){catIn=parsed.catIn;saveCatIn();}
      if(Array.isArray(parsed.sources)&&parsed.sources.length){sources=parsed.sources;saveSources();}
      if(parsed.splitPct>=0&&parsed.splitPct<=100){splitPct=parsed.splitPct;saveSplit();}
      if(parsed.dailyDebt!==undefined&&parsed.dailyDebt>0){DAILY_DEBT=parsed.dailyDebt;saveDebtRate();}
      else if(parsed.dailyRate!==undefined&&parsed.dailyRate>0){DAILY_DEBT=parsed.dailyRate;saveDebtRate();}
      if(parsed.dailySav!==undefined&&parsed.dailySav>0){DAILY_SAV=parsed.dailySav;saveSavRate();}
      else if(parsed.dailyRate!==undefined&&parsed.dailyRate>0){DAILY_SAV=parsed.dailyRate;saveSavRate();}
      debtGoals.forEach(g=>{if(parsed.debt.paid[g.id]===undefined)parsed.debt.paid[g.id]=0;});
      state={debt:parsed.debt,money:parsed.money,savings:parsed.savings||{goals:[]}};
      if(parsed.incSav&&parsed.incSav.cfg){ incSav=parsed.incSav; if(!Array.isArray(incSav.moves)) incSav.moves=[]; saveIncSav(); }
      else { incSav={cfg:{},moves:[]}; saveIncSav(); migrateYouTubeSavings(true); }
      if(Array.isArray(parsed.history)){ histData=parsed.history; saveHist(); } else { histData=[]; seedHistory(); }
      rec("app","Backup restored");
      saveAll();refreshOldPlans();try{localStorage.setItem("pfhub_welcome_off","1");}catch(e){}showToast("✅ Data restored!");renderDebt();renderMoney();renderSavings();renderNotice();
    }catch(err){alert("Could not read backup file.");}
  };
  reader.readAsText(file);event.target.value="";
}

// the old "YouTube Savings" goal becomes part of the pots (once)
function migrateYouTubeSavings(force){
  try{
    if(!force && localStorage.getItem("pfhub_incsav_moved_v1")) return;
    const g=savGoals.find(x=>dest&&dest.sav&&String(x.id)===String(dest.sav)) || savGoals.find(x=>x.name==="YouTube Savings");
    if(g){
      const movedBuild=(incomeData.entries||[]).filter(e=>e.moved).reduce((a,e)=>a+(e.build||0),0);
      const extra=Math.round(((g.saved||0)-movedBuild)*100)/100;
      if(!sources.some(x=>x.id==="src_oth")){ sources.push({id:"src_oth",name:"Other"}); saveSources(); }
      if(extra>=1) incSav.moves.push({id:uid("im_"),d:TODAY,src:"src_oth",kind:"carry",a:extra,note:"Carried over from old YouTube Savings"});
      else if(extra<=-1) incSav.moves.push({id:uid("im_"),d:TODAY,src:"src_oth",kind:"out",a:-extra,note:"Adjustment from old YouTube Savings"});
      saveIncSav();
      savGoals=savGoals.filter(x=>x!==g); savOrder=savOrder.filter(x=>String(x)!==String(g.id));
      saveSavGoals(); saveSavOrder();
    }
    if(dest&&dest.sav){ dest.sav=null; saveDest(); }
    localStorage.setItem("pfhub_incsav_moved_v1","1");
  }catch(e){}
}
function potRows(from,to){
  const m={};
  const get=id=>{ id=id||"src_oth"; if(!m[id]) m[id]={src:id,earned:0,saved:0,spend:0,out:0,carry:0,n:0,outs:0}; return m[id]; };
  sources.forEach(x=>get(x.id));
  (incomeData.entries||[]).forEach(e=>{ if(!inRange(e.date,from,to)) return; const r=get(e.src); r.earned+=e.amount||0; r.saved+=e.build||0; r.spend+=e.live||0; r.n++; });
  (incSav.moves||[]).forEach(mv=>{ if(!inRange(mv.d,from,to)) return; const r=get(mv.src); if(mv.kind==="out"){ r.out+=mv.a||0; r.outs++; } else r.carry+=mv.a||0; });
  return Object.values(m).map(r=>({...r, net:r.saved+r.carry-r.out}));
}
function rangeFrom(p){
  if(p==="year") return TODAY.slice(0,4)+"-01-01";
  if(p==="month") return TODAY.slice(0,7)+"-01";
  if(p==="week"){ const d=new Date(TODAY); const day=d.getUTCDay(), back=(day===0?6:day-1); d.setUTCDate(d.getUTCDate()-back); return d.toISOString().split("T")[0]; }
  return "";
}

// ----- one reusable pop-up sheet -----
function openFhSheet(){ document.getElementById("fhSheet").classList.add("open"); }
function closeFhSheet(){ document.getElementById("fhSheet").classList.remove("open"); }
const SH_BTN="width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Outfit',sans-serif;margin-top:8px;";
function shErr(msg){ const el=document.getElementById("shErr"); if(el){ el.textContent=msg; el.style.display=msg?"block":"none"; } }
const SH_ERR=`<div id="shErr" style="display:none;font-size:12.5px;color:#FF453A;margin:2px 0 6px;font-weight:700"></div>`;

// take out
function openTakeOut(src){
  const r=potRows("","").find(x=>String(x.src)===String(src)); const net=r?r.net:0;
  if(net<=0){ showToast("Nothing in this pot to take out","#FF9F0A"); return; }
  document.getElementById("fhSheetBody").innerHTML=`
    <div style="font-size:16px;font-weight:800;color:#FF6961;margin-bottom:4px">➖ Take out · ${getSource(src).name}</div>
    <div style="font-size:12px;color:#8A8A8A;margin-bottom:12px">In this pot: <b style="color:#30D158">${fmtC(net)}</b></div>
    <input class="modal-input" type="number" id="toAmt" placeholder="Amount (GH₵)" oninput="shErr('')"/>
    <input class="modal-input" type="date" id="toDate" value="${TODAY}"/>
    <input class="modal-input" id="toNote" placeholder="What is it for? (optional)"/>
    ${SH_ERR}
    <button onclick="saveTakeOut('${src}')" style="${SH_BTN}background:#FF453A;border:none;color:#fff">Take it out</button>
    <button onclick="closeFhSheet()" class="btn-modal-cancel" style="width:100%;margin-top:8px">Cancel</button>`;
  openFhSheet();
}
function saveTakeOut(src){
  const amt=parseFloat(document.getElementById("toAmt").value);
  const d=document.getElementById("toDate").value||TODAY;
  const note=(document.getElementById("toNote").value||"").trim();
  const r=potRows("","").find(x=>String(x.src)===String(src)); const net=r?r.net:0;
  if(!amt||amt<=0){ shErr("Enter an amount first"); return; }
  if(amt>net+0.001){ shErr(`Only ${fmtC(net)} is in this pot`); return; }
  const id=uid("im_");
  incSav.moves.push({id,d,src,kind:"out",a:amt,note}); saveIncSav();
  rec("isav",`Took out ${fmtC(amt)} from ${getSource(src).name}${note?' · '+note:''}${d!==TODAY?' (dated '+shortDate(d)+')':''}`,amt,src);
  closeFhSheet(); renderSavings(); showToast(`➖ ${fmtC(amt)} taken out of ${getSource(src).name}`,"#FF9F0A");
}

function openEditPot(src){

      <span style="font-size:12.5px;font-weight:800;color:${m.kind==="out"?'#FF453A':'#30D158'}">${m.kind==="out"?'−':'+'}${fmt(m.a)}<b onclick="deletePotMove('${m.id}','${src}')" style="color:#FF453A;cursor:pointer;margin-left:9px;font-weight:400">🗑</b></span></div>`).join(""):''}
    ${src!=="src_oth"?`<button onclick="removePot('${src}')" style="${SH_BTN}background:#161616;border:1px solid #FF453A55;color:#FF453A;margin-top:16px">Remove this source</button>`:''}
    <button onclick="closeFhSheet()" class="btn-modal-cancel" style="width:100%;margin-top:8px">Close</button>`;
  openFhSheet();
