function saveEditPot(src){
  const n=(document.getElementById("epName").value||"").trim();
  const pct=parseFloat(document.getElementById("epPct").value);
  const tg=parseFloat(document.getElementById("epTarget").value)||0;
  if(!n){ shErr("Enter a name first"); return; }
  if(sources.some(x=>String(x.id)!==String(src)&&x.name.toLowerCase()===n.toLowerCase())){ shErr("That name is already there"); return; }
  if(isNaN(pct)||pct<0||pct>100){ shErr("Save share must be 0 to 100"); return; }
  const old=getSource(src).name, oldPct=srcPct(src), oldT=srcTarget(src);
  let s=sources.find(x=>String(x.id)===String(src));
  if(!s){ s={id:src,name:n}; sources.push(s); }
  s.name=n; saveSources();
  incSav.cfg[src]={pct:Math.round(pct),target:tg>0?tg:0}; saveIncSav();
  const ch=[];
  if(old!==n) ch.push(`name ${old} → ${n}`);
  if(oldPct!==Math.round(pct)) ch.push(`split ${oldPct}% → ${Math.round(pct)}%`);
  if(oldT!==(tg>0?tg:0)) ch.push(`target ${oldT?fmtC(oldT):'none'} → ${tg>0?fmtC(tg):'none'}`);
  if(ch.length) rec("isav",`Edited ${n} · ${ch.join(', ')}`,null,src);
  closeFhSheet(); paintSettings(); renderSavings(); renderMoney(); showToast("✅ Saved");
}
function deletePotMove(id,src){
  const m=(incSav.moves||[]).find(x=>String(x.id)===String(id)); if(!m) return;
  if(!confirm(`Delete this ${m.kind==="out"?"take-out":"carry-over"} of ${fmtC(m.a)}?`)) return;
  incSav.moves=incSav.moves.filter(x=>x!==m); saveIncSav();
  rec("isav",`Deleted ${m.kind==="out"?"take-out":"carry-over"} of ${fmtC(m.a)} from ${getSource(src).name}${m.note?' · '+m.note:''}`,m.a,src);
  openEditPot(src); renderSavings();
}
function removePot(src){
  const used=incomeData.entries.some(e=>String(e.src)===String(src));
  if(!used && !confirm(`Remove ${getSource(src).name}?`)) return;
  const before=sources.length;
  removeSource(src);
  if(sources.length<before){ closeFhSheet(); paintSettings(); renderSavings(); renderBackup(); showToast("🗑 Source removed"); }
}

// ----- spending / lists clear buttons (now recorded) -----
function clearManualSpend(){
  const man=spendData.entries.filter(e=>!e.auto);
  if(!man.length) return;
  if(!confirm(`Clear all ${man.length} manual entries?`)) return;
  const tot=man.reduce((a,e)=>a+(e.amount||0),0);
  spendData.entries=spendData.entries.filter(e=>e.auto); saveSpend();
  rec("spend",`Cleared ${man.length} manual spending entries (${fmtC(tot)})`,tot,null);
  renderMoney(); renderBudget();
}
function wnClearBought(){
  if(!confirm("Clear bought items from the record?")) return;
  const key=wnTab==="wants"?"wants":"needs";
  const gone=(wnData[key]||[]).filter(x=>x.bought);
  wnData[key]=(wnData[key]||[]).filter(x=>!x.bought); saveWN();
  rec("lists",`Cleared ${gone.length} bought ${key} from the record${gone.length?': '+gone.map(x=>x.name).join(', '):''}`,null,null);

}

// ===== HISTORY =====
const HIST_KEY="pfhub_history_v1";
var histData=(function(){ try{ const r=localStorage.getItem(HIST_KEY); if(r){ const a=JSON.parse(r); if(Array.isArray(a)) return a; } }catch(e){} return []; })();
function saveHist(){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(histData)); }catch(e){} }
function nowStamp(){ const n=new Date(), p=x=>String(x).padStart(2,"0"); return {d:`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`, tm:`${p(n.getHours())}:${p(n.getMinutes())}`}; }
function rec(c,x,a,r){
  try{ const st=nowStamp();
    histData.unshift({id:uid("h_"),d:st.d,tm:st.tm,c,x,a:(a===null||a===undefined)?null:Math.round(a*100)/100,r:(r===null||r===undefined)?null:String(r)});
    saveHist(); }catch(e){}
}
function histSort(){ histData.sort((a,b)=>{ const ka=(a.d||"")+(a.tm||""), kb=(b.d||"")+(b.tm||""); return ka<kb?1:ka>kb?-1:0; }); }
// write down everything that already happened before history existed
function seedHistory(){
  const out=[];
  const add=(d,c,x,a,r)=>out.push({id:uid("h_"),d:d||TODAY,tm:"",c,x,a:(a==null?null:a),r:(r==null?null:String(r)),old:1});
  (incomeData.entries||[]).forEach(e=>{ const n=getSource(e.src).name;
    add(e.date,"income",`Received ${fmtC(e.amount)} from ${n}${e.note?' · '+e.note:''}`,e.amount,e.src);
    if(e.build>0) add(e.date,"isav",`${fmtC(e.build)} saved into ${n} (${e.splitAt!=null?e.splitAt:srcPct(e.src)}%)`,e.build,e.src); });
  (incSav.moves||[]).forEach(m=>{ const n=getSource(m.src).name;
    add(m.d,"isav",m.kind==="out"?`Took out ${fmtC(m.a)} from ${n}${m.note?' · '+m.note:''}`:`${fmtC(m.a)} into ${n} · ${m.note||'carried over'}`,m.a,m.src); });
  (D().log||[]).forEach(l=>{ const g=debtGoals.find(x=>String(x.id)===String(l.goalId)); add(l.date,"debt",`Paid ${fmtC(l.amount)} to ${l.label||(g&&g.label)||'a debt'}`,l.amount,l.goalId); });
  (buyPlans||[]).forEach(p=>(p.log||[]).forEach(l=>add(l.date,"buy",`${l.seed?'Already saved':'Paid'} ${fmtC(l.amount)} to ${p.label}`,l.amount,p.id)));
  (savGoals||[]).forEach(g=>(g.log||[]).forEach(l=>add(l.date,"goal",`${l.seed?'Already saved':'Saved'} ${fmtC(l.amount)} into ${g.name}`,l.amount,g.id)));
  (spendData.entries||[]).filter(e=>!e.auto).forEach(e=>{ const cl=getCat(e.cat).label; add(e.date,"spend",`Spent ${fmtC(e.amount)} on ${cl}${e.desc&&e.desc!==cl?' · '+e.desc:''}`,e.amount,e.cat); });
  [...(wnData.wants||[]),...(wnData.needs||[])].filter(x=>x.bought).forEach(x=>add(x.boughtDate,"lists",`Bought ${x.name}${x.price?' · '+fmtC(x.price):''}`,x.price||null,x.id));
  histData=histData.concat(out); histSort(); saveHist();
}
const HCATS=[["all","All",""],["income","Income","💵"],["isav","Income Savings","📺"],["goal","Goals","🏦"],["debt","Debt","💳"],["buy","Buy","🛒"],["spend","Spending","🧾"],["budget","Budget","🗓️"],["lists","Lists","🛍️"],["app","App","⚙️"]];
function hIcon(c){ const x=HCATS.find(k=>k[0]===c); return x?x[2]:"•"; }
var histF={c:"all",p:"all",q:"",r:null,n:150};
function refName(r){
  const f=a=>(a||[]).find(x=>String(x.id)===String(r));
  const x=f(debtGoals)||f(buyPlans); if(x) return x.label;
  const g=f(savGoals); if(g) return g.name;
  const s=f(sources); if(s) return s.name;
  const it=f([...(wnData.wants||[]),...(wnData.needs||[])]); if(it) return it.name;
  const sb=f(subs); if(sb) return sb.name;
  const c=f(spendCats); if(c) return c.label;
  return "this item";
}
function openHistory(o){ histF={c:"all",p:"all",q:"",r:(o&&o.r)?String(o.r):null,n:150}; paintHistory(); openFhSheet(); }
function paintHistory(){
  const chip=(on,lab,js)=>`<span onclick="${js}" style="flex:none;font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:9px;cursor:pointer;background:${on?'#FFD60A':'#161616'};color:${on?'#000':'#C9C9C9'};border:1px solid ${on?'#FFD60A':'#2A2A2A'}">${lab}</span>`;
  document.getElementById("fhSheetBody").innerHTML=`
    <div class="row" style="margin-bottom:10px"><span style="font-size:16px;font-weight:800;color:#FFD60A">📜 History${histF.r?' · '+refName(histF.r):''}</span>
      <span onclick="closeFhSheet()" style="font-size:18px;color:#8A8A8A;cursor:pointer;padding:2px 6px">✕</span></div>
    ${histF.r?`<button onclick="histF.r=null;paintHistory()" style="width:100%;margin-bottom:10px;padding:9px;border-radius:10px;background:#161616;border:1px solid #333;color:#E5E5E5;font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif">Show all history</button>`:''}
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px">${HCATS.map(k=>chip(histF.c===k[0],(k[2]?k[2]+' ':'')+k[1],`histF.c='${k[0]}';histF.n=150;paintHistory()`)).join("")}</div>
    <div style="display:flex;gap:6px;margin-bottom:8px">${[["week","This Week"],["month","This Month"],["year","This Year"],["all","All time"]].map(k=>chip(histF.p===k[0],k[1],`histF.p='${k[0]}';histF.n=150;paintHistory()`)).join("")}</div>
    <input class="modal-input" id="histQ" placeholder="Search history" value="${(histF.q||'').replace(/"/g,'&quot;')}" oninput="histF.q=this.value;histF.n=150;paintHistList()"/>
    <div id="histList"></div>`;
  paintHistList();
}
function histFiltered(){
  const from=histF.p==="all"?"":rangeFrom(histF.p), q=(histF.q||"").trim().toLowerCase();
  return histData.filter(h=>(!histF.r||String(h.r)===String(histF.r)) && (histF.c==="all"||h.c===histF.c) && (!from||(h.d||"")>=from) && (!q||(h.x||"").toLowerCase().includes(q)));
}
function paintHistList(){
  const el=document.getElementById("histList"); if(!el) return;
  const list=histFiltered();
  if(!list.length){ el.innerHTML=`<div class="empty-msg" style="padding:20px 0">Nothing recorded here yet.</div>`; return; }
  let html=`<div style="font-size:11px;color:#8A8A8A;margin:2px 0 6px">${list.length} record${list.length!==1?'s':''}</div>`, day="";
  for(const h of list.slice(0,histF.n)){
    if(h.d!==day){ day=h.d; html+=`<div style="font-size:11px;color:#FFD60A;font-weight:800;margin:12px 0 4px">${longDate(h.d)}</div>`; }
    html+=`<div style="display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #1C1C1C">
      <div style="font-size:15px;line-height:1.2">${hIcon(h.c)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:12.5px;color:#E5E5E5;line-height:1.45">${h.x}</div>
        <div style="font-size:10.5px;color:#6A6A6A;margin-top:1px">${h.tm?h.tm:'earlier record'}</div></div></div>`;
  }
  if(list.length>histF.n) html+=`<button onclick="histF.n+=150;paintHistList()" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;background:#161616;border:1px solid #333;color:#E5E5E5;font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif">Show more</button>`;

  window[name]=function(){ let c=null; try{ c=before?before.apply(null,arguments):null; }catch(e){} const r=o.apply(this,arguments); try{ after.apply(null,[c,...arguments]); }catch(e){} return r; };

  var labs={week:"this week",month:"this month",year:"this year",lifetime:"lifetime"};
  var boxes=[
    {n:"card",l:"Debt paid",bg:"#F8CFCF",c:"#C2302C",a:catTotal('debt',all)+arch.debt},
    {n:"pig",l:"Savings",bg:"#C6E5F0",c:"#1C7891",a:catTotal('sav',all)+arch.sav},
    {n:"bag",l:"Lists",bg:"#DFD1F0",c:"#5E3A8C",a:catTotal('wants',all)+catTotal('needs',all)+catTotal('buy',all)+arch.wants+arch.needs},
    {n:"pie",l:"Budget",bg:"#FFDCA8",c:"#B56A08",a:all.filter(function(e){return ['debt','sav','wants','needs','buy'].indexOf(e.cat)<0;}).reduce(function(s,e){return s+e.amount;},0)+arch.budget}];

  var n=all.length+arch.count;

    '<div class="sx-card sx-up" style="padding:4px 18px">'+(list.length?list.map(function(e){
      var cat=getCat(e.cat), ic=sxCatIcon(cat);

    }).join(""):'<div style="padding:18px 0;color:var(--muted);text-align:center">No transactions this period.</div>')+

<script>
// v111: installable app. Registers the offline file. Does not touch any saved data.
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});});}
// v113: Install App button. Shows only when Chrome allows installing, hides once installed.
(function(){
  var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();deferred=e;
    if(standalone||document.getElementById('fhInstallBtn'))return;
    var b=document.createElement('button');b.id='fhInstallBtn';b.type='button';b.textContent='\u2B07 Install Finance Hub';
    b.style.cssText='position:fixed;right:14px;bottom:96px;z-index:9999;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:11px 16px;background:#FFD700;color:#000;font:800 13px Outfit,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.45)';
    b.addEventListener('click',function(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;b.remove();});});
    document.body.appendChild(b);
  });
  window.addEventListener('appinstalled',function(){deferred=null;var b=document.getElementById('fhInstallBtn');if(b)b.remove();});
})();
</script>
