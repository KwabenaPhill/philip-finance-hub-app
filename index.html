function histFiltered(){
  const from=histF.p==="all"?"":rangeFrom(histF.p), q=(histF.q||"").trim().toLowerCase();
  return histData.filter(h=>(!histF.r||String(h.r)===String(histF.r)) && (histF.c==="all"||h.c===histF.c) && (!from||(h.d||"")>=from) && (!q||(h.x||"").toLowerCase().includes(q)));
}
function paintHistList(){
  const el=document.getElementById("histList"); if(!el) return;
  const list=histFiltered();
  if(!list.length){ el.innerHTML=`<div class="empty-msg" style="padding:20px 0">Nothing recorded here yet.</div>`; return; }
  let html=`<div style="font-size:11px;color:#8A8A8A;margin:2px 0 6px">${list.length} record${list.length!==1?'s':''}</div>`, day="";
  for(const h of list.slice(0,histF.n)){
    if(h.d!==day){ day=h.d; html+=`<div style="font-size:11px;color:#FFD60A;font-weight:800;margin:12px 0 4px">${longDate(h.d)}</div>`; }
    html+=`<div style="display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #1C1C1C">
      <div style="font-size:15px;line-height:1.2">${hIcon(h.c)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:12.5px;color:#E5E5E5;line-height:1.45">${h.x}</div>
        <div style="font-size:10.5px;color:#6A6A6A;margin-top:1px">${h.tm?h.tm:'earlier record'}</div></div></div>`;
  }
  if(list.length>histF.n) html+=`<button onclick="histF.n+=150;paintHistList()" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;background:#161616;border:1px solid #333;color:#E5E5E5;font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif">Show more</button>`;
  el.innerHTML=html;
}

// ----- record every action (wrappers watch what changed) -----
function hw(name, before, after){
  const o=window[name]; if(typeof o!=="function") return;
  window[name]=function(){ let c=null; try{ c=before?before.apply(null,arguments):null; }catch(e){} const r=o.apply(this,arguments); try{ after.apply(null,[c,...arguments]); }catch(e){} return r; };
}
const idsOf=a=>new Set((a||[]).map(x=>String(x.id)));
const freshOf=(a,set)=>(a||[]).filter(x=>!set.has(String(x.id)));
const isOpen=id=>{ const el=document.getElementById(id); return !!(el&&el.classList.contains("open")); };
const snap=o=>o?JSON.parse(JSON.stringify(o)):null;
function diffTxt(o,n,map){
  if(!o||!n) return "";
  const parts=[];
  for(const [k,lab,f] of map){ const a=o[k]==null?"":o[k], b=n[k]==null?"":n[k]; if(String(a)!==String(b)) parts.push(`${lab} ${a===""?'none':(f?f(a):a)} → ${b===""?'none':(f?f(b):b)}`); }
  return parts.length?" · "+parts.join(", "):" · no changes";
}

hw("clearSavGoal",(id)=>{ const g=findIn(savGoals,id); return g?{w:!!g.cleared}:null; },(c,id)=>{ const g=findIn(savGoals,id); if(c&&!c.w&&g&&g.cleared) rec("goal",`Settled ${g.name} · ${fmtC(g.saved)}`,null,id); });
hw("restartSavGoal",()=>({n:savGoals.length}),(c,id)=>{ if(savGoals.length>c.n){ const g=findIn(savGoals,id); rec("goal",`Started a fresh round of ${g?g.name:'a goal'} · old round kept in records`,null,id); } });
hw("continueSavGoal",(id)=>{ const g=findIn(savGoals,id); return g?{w:!!g.completed}:null; },(c,id)=>{ const g=findIn(savGoals,id); if(c&&c.w&&g&&!g.completed) rec("goal",`Reopened ${g.name} · continue where you left off`,null,id); });

hw("dtSaveRate",()=>({r:dtRateToday()}),(c)=>{ const n=dtRateToday(); if(n!==c.r) rec("app",`Daily target ${fmtC(c.r)} → ${fmtC(n)} a day`,null,null); });
hw("dtRestart",()=>({s:JSON.stringify(dailyTarget)}),(c)=>{ if(JSON.stringify(dailyTarget)!==c.s) rec("app","Daily count restarted from today",null,null); });
hw("saveSettings",()=>({p:splitPct,r:dtRateToday()}),(c)=>{ if(splitPct!==c.p) rec("app",`Default split ${c.p}% → ${splitPct}% save`,null,null); const n=dtRateToday(); if(n!==c.r) rec("app",`Daily target ${fmtC(c.r)} → ${fmtC(n)} a day`,null,null); });

hw("saveIncomeEntry",()=>({ids:idsOf(incomeData.entries)}),(c)=>{ freshOf(incomeData.entries,c.ids).forEach(e=>{ const n=getSource(e.src).name;
  rec("income",`Received ${fmtC(e.amount)} from ${n}${e.note?' · '+e.note:''}${e.date!==TODAY?' (dated '+shortDate(e.date)+')':''}`,e.amount,e.src);
  if(e.build>0) rec("isav",`${fmtC(e.build)} saved into ${n} (${e.splitAt}%) · ${fmtC(e.live)} to spend`,e.build,e.src); }); });
hw("deleteIncome",(id)=>snap(findIn(incomeData.entries,id)),(c,id)=>{ if(c&&!findIn(incomeData.entries,id)){ const n=getSource(c.src).name;
  rec("income",`Deleted payment of ${fmtC(c.amount)} from ${n} (${shortDate(c.date)})`,c.amount,c.src);
  if(c.build>0) rec("isav",`${fmtC(c.build)} left ${n}'s pot (payment deleted)`,c.build,c.src); } });

hw("logBudgetSpend",()=>({ids:idsOf(spendData.entries)}),(c)=>{ freshOf(spendData.entries,c.ids).forEach(e=>{ const cl=getCat(e.cat).label; rec("spend",`Spent ${fmtC(e.amount)} on ${cl}${e.desc&&e.desc!==cl?' · '+e.desc:''}${e.date.slice(0,7)!==TODAY.slice(0,7)?' (for '+monthLabel(e.date.slice(0,7))+')':''}`,e.amount,e.cat); }); });
hw("deleteSpendEntry",(id)=>snap(findIn(spendData.entries,id)),(c,id)=>{ if(c&&!findIn(spendData.entries,id)) rec("spend",`Deleted spending ${fmtC(c.amount)} · ${getCat(c.cat).label}${c.desc?' · '+c.desc:''} (${shortDate(c.date)})`,c.amount,c.cat); });
hw("saveCatModal",()=>({ids:idsOf(spendCats)}),(c)=>{ freshOf(spendCats,c.ids).forEach(x=>rec("budget",`Added category ${x.icon||''} ${x.label}`,null,x.id)); });
hw("deleteCat",(id)=>snap(findIn(spendCats,id)),(c,id)=>{ if(c&&!findIn(spendCats,id)) rec("budget",`Deleted category ${c.label}`,null,id); });
hw("setMonthlyPlan",()=>({v:monthlyPlan}),(c)=>{ if(monthlyPlan!==c.v) rec("budget",`Monthly plan ${fmtC(c.v)} → ${fmtC(monthlyPlan)}`,null,null); });
hw("setCatBudget",(id)=>({v:budgets[id]||0}),(c,id)=>{ const n=budgets[id]||0; if(n!==c.v) rec("budget",`${getCat(id).label} budget ${c.v?fmtC(c.v):'none'} → ${n?fmtC(n):'none'}`,null,id); });
hw("saveSubModal",()=>({ids:idsOf(subs),edit:subModalEditId,old:snap(findIn(subs,subModalEditId))}),(c)=>{
  if(isOpen("subModal")) return;
  if(c.edit){ const x=findIn(subs,c.edit); if(x) rec("budget",`Edited subscription ${x.name}${diffTxt(c.old,x,[["name","name"],["amount","cost",fmtC],["deadline","renews",shortDate]])}`,null,x.id); }
  else freshOf(subs,c.ids).forEach(x=>rec("budget",`Added subscription ${x.name} · ${fmtC(x.amount)}/month${x.deadline?' · renews '+shortDate(x.deadline):''}`,x.amount,x.id));
});
hw("confirmSubDate",()=>({id:subDateTargetId,mode:subDateMode,n:spendData.entries.length}),(c)=>{ if(spendData.entries.length>c.n){ const x=findIn(subs,c.id); if(x) rec("budget",`${c.mode==="reactivate"?'Reactivated':'Renewed'} ${x.name} · ${fmtC(x.amount)} logged as spending · next ${shortDate(x.deadline)}`,x.amount,x.id); } });
hw("cancelSub",(id)=>{ const x=findIn(subs,id); return x?{w:!!x.cancelled}:null; },(c,id)=>{ const x=findIn(subs,id); if(c&&!c.w&&x&&x.cancelled) rec("budget",`Cancelled subscription ${x.name}`,null,id); });
hw("reactivateSub",(id)=>{ const x=findIn(subs,id); return x?{w:!!x.cancelled}:null; },(c,id)=>{ const x=findIn(subs,id); if(c&&c.w&&x&&!x.cancelled) rec("budget",`Reactivated subscription ${x.name}${x.deadline?' · renews '+shortDate(x.deadline):''}`,null,id); });
hw("deleteSub",(id)=>snap(findIn(subs,id)),(c,id)=>{ if(c&&!findIn(subs,id)) rec("budget",`Removed subscription ${c.name}`,null,id); });

hw("wnSave",()=>({edit:wnEditId,tab:wnTab,ids:idsOf([...(wnData.wants||[]),...(wnData.needs||[])]),old:snap(findIn(wnTab==="wants"?wnData.wants:wnData.needs,wnEditId))}),(c)=>{
  const all=[...(wnData.wants||[]),...(wnData.needs||[])];
  if(c.edit){ const it=findIn(all,c.edit); if(it&&wnEditId===null) rec("lists",`Edited ${it.name}${diffTxt(c.old,it,[["name","name"],["price","price",fmtC]])}`,null,it.id); }
  else freshOf(all,c.ids).forEach(it=>rec("lists",`Added ${it.name} to ${c.tab==="wants"?"Wants":"Needs"}${it.price?' · '+fmtC(it.price):''}`,it.price||null,it.id));
});
hw("wnDelete",(id)=>({it:snap(findIn([...(wnData.wants||[]),...(wnData.needs||[])],id)),tab:wnTab}),(c,id)=>{ if(c.it&&!findIn([...(wnData.wants||[]),...(wnData.needs||[])],id)) rec("lists",`Deleted ${c.it.name} from ${c.tab==="wants"?"Wants":"Needs"}`,null,id); });
hw("wnToggleBought",(id)=>{ const it=findIn([...(wnData.wants||[]),...(wnData.needs||[])],id); return it?{w:!!it.bought}:null; },(c,id)=>{ const it=findIn([...(wnData.wants||[]),...(wnData.needs||[])],id); if(c&&it&&it.bought!==c.w) rec("lists",it.bought?`Bought ${it.name}${it.price?' · '+fmtC(it.price):''}`:`Unticked ${it.name} (not bought)`,it.bought?(it.price||null):null,id); });

ensureDestinations();
migrateYouTubeSavings(false);
if(!localStorage.getItem("pfhub_hist_seeded_v1")){ seedHistory(); try{localStorage.setItem("pfhub_hist_seeded_v1","1");}catch(e){} }
refreshOldPlans();
renderDebt();
renderMoney();
renderSavings();
renderNotice();
</script>
